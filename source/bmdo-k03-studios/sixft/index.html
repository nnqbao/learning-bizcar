nh','Tích hợp dữ liệu','Chuẩn hóa metadata','Cập nhật và bảo vệ']},T4:{name:'Thương hiệu',en:'Brand Equity',color:'#bf6355',examples:['Bản sắc & nhận diện','Nhận biết thương hiệu','Liên tưởng thương hiệu','Chất lượng cảm nhận','Khác biệt có ý nghĩa','Niềm tin thương hiệu','Mức ưu tiên chọn mua','Sự trung thành','Giới thiệu / advocacy','Quyền nhãn hiệu & dấu hiệu','Uy tín doanh nghiệp','Thương hiệu sản phẩm / dịch vụ'],metric:'Nhận biết, cân nhắc, ưu tiên trong phân khúc mục tiêu',signals:['Khách hàng ít cân nhắc','Liên tưởng tiêu cực tăng','Cam kết khác trải nghiệm','Mất tính khác biệt'],methods:['Thực hiện lời hứa','Nâng chất lượng trải nghiệm','Xây khác biệt có căn cứ','Kiểm chứng nhận thức thị trường','Truyền thông phù hợp']},T5:{name:'Tài chính',en:'Financial Capital',color:'#805f9a',examples:['Tiền & tương đương tiền','Đầu tư tài chính','Khoản phải thu','Tài sản có thể huy động','Vốn chủ sở hữu','Nguồn vốn vay','Khả năng tiếp cận tài trợ','Năng lực tạo dòng tiền','Sinh lời & hiệu quả vốn','Dự phòng & chống chịu','Tài trợ thương mại','Tài sản bảo đảm / quyền tài chính'],metric:'Tiền khả dụng và nhu cầu thanh toán theo kỳ',signals:['Thiếu tiền đến hạn','Công nợ thu chậm','Tài sản khó chuyển thành tiền','Nghĩa vụ tăng nhanh'],methods:['Thu hồi công nợ','Tạo dòng tiền hoạt động','Kiểm soát rủi ro / bảo toàn','Tái phân bổ vốn','Huy động phù hợp']},T6:{name:'Tín kết',en:'Trusionship Capital',color:'#987333',examples:['Tín kết khách hàng','Tín kết nhà cung cấp','Tín kết kênh phân phối','Tín kết ngân hàng / đầu tư','Tín kết chuyên gia / trường viện','Tín kết nguồn nhân lực mở','Tín kết đối tác công nghệ','Tín kết hiệp hội ngành','Tín kết cộng đồng','Tín kết liên minh chiến lược','Tín kết với đối tác logistics','Tín kết đối tác quốc tế'],metric:'Quan hệ hợp tác trọng yếu đáng tin và khả dụng / nhu cầu hợp tác',signals:['Cam kết liên tục bị trễ','Hợp tác suy giảm','Phụ thuộc một người kết nối','Thiếu lợi ích hai chiều'],methods:['Thực hiện cam kết','Chia sẻ giá trị tương const DESC={T1:'Tri thức, bí quyết, phương pháp, kinh nghiệm và tài sản trí tuệ có thể dùng và chuyển giao.',T2:'Năng lực con người có thể huy động đúng vai trò, đúng lúc để tạo kết quả.',T3:'Dữ liệu được tổ chức, kiểm chứng, có quyền sử dụng và hỗ trợ quyết định.',T4:'Nhận biết, tin tưởng và ưu tiên mà thị trường đã tích lũy cho doanh nghiệp.',T5:'Khả năng tiếp cận, huy động, chịu đựng và sử dụng tài chính.',T6:'Quan hệ đủ niềm tin và khả năng phối hợp để cùng tạo giá trị.'};
const TANKS=Object.keys(F);
const steps=['Activate|Doanh nghiệp & Target','Paradigm|Mô thức 6FT','Practise|Kiểm kê & đo','Lens|Bản đồ trước','Improve|Thiết kế bơm','Extract|Trước / sau','Resolve|Cam kết'];
const LENSES=[['Mục tiêu','Nguồn lực có thật sự cần cho Target hay chỉ “có thì tốt”?'],['Huy động mở','Nguồn nào không cần doanh nghiệp trực tiếp sở hữu?'],['Chuyển hóa','Nguồn sẽ đi qua ai, quy trình nào và tạo kết quả gì?'],['Rủi ro','Nguồn nào phụ thuộc cá nhân, dễ gián đoạn, tiêu hao hoặc chưa được bảo vệ?']];
const EVIDENCE=[['none','Chưa có dữ liệu'],['subjective','Chủ yếu tự nhận định'],['partial','Có bằng chứng một phần'],['verified','Đã kiểm chứng trong phạm vi mô tả']];
const VALUE_METHODS=[['notready','Chưa đủ căn cứ định giá'],['cost','Chi phí tạo lập / thay thế'],['benefit','Lợi ích kinh tế tăng thêm'],['saving','Chi phí có thể tiết kiệm'],['right','Quyền/định giá chuyên biệt (cần chuyên gia)']];
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
function blank(){return {kind:'6ft',version:1,company:{name:'',industry:'',size:'',model:'',target:'',cycle:'90 ngày',currency:'VND'},items:[],plans:[],notes:{}}}
function valid(x){if(!x||typeof x!=='object'||Array.isArray(x)||x.kind!=='6ft'||x.version!==1)return false;for(const k of ['company','notes'])if(!x[k]||typeof x[k]!=='object'||Array.isArray(x[k]))return false;if(Object.values(x.company).some(v=>v!=null&&typeof v!=='string'))return false;if(Object.values(x.notes).some(v=>typeof v!=='string'))return false;if(!Array.isArray(x.items)||!Array.isArray(x.plans)||x.items.length>2000||x.plans.length>2000)return false;const ids=new Set();for(const i of x.items){if(!i||typeof i!=='object'||typeof i.id!=='string'||!i.id||ids.has(i.id)||!Object.hasOwn(F,i.tank)||typeof i.name!=='string')return false;for(const k of ['qty','need','quality','access','baseBenefit','cost','attribution'])if(i[k]!==undefined&&i[k]!==null&&!Number.isFinite(Number(i[k])))return false;ids.add(i.id)}const pids=new Set();for(const p of x.plans){if(!p||typeof p!=='object'||typeof p.id!=='string'||!p.id||pids.has(p.id)||!ids.has(p.itemId))return false;pids.add(p.id)}return true}
// Bản CEO Lab (ZIP) lưu {company, items, plans} hoặc xuất {app, version, data}; chuyển sang hồ sơ 6FT Studio.
function upgrade(o){const d=o&&typeof o==='object'&&o.data&&typeof o.data==='object'&&!o.kind?o.data:o;if(!d||typeof d!=='object'||!Array.isArray(d.items)||!Array.isArray(d.plans)||!d.company||typeof d.company!=='object')return d;const b=blank();return {...d,kind:'6ft',version:1,company:{...b.company,...d.company},notes:d.notes&&typeof d.notes==='object'&&!Array.isArray(d.notes)?d.notes:{}}}
function load(){try{const x=upgrade(JSON.parse(localStorage.getItem(KEY)));return valid(x)?x:blank()}catch{return blank()}}
let state=load(),tab=0,editCtx=null,planCtx=null,noteTimer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Không lưu được. Hãy xuất JSON để sao lưu.')}}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString('vi-VN')+' '+(state.company.currency||'VND')}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fnum(x){return Math.max(0,Number(x)||0)}
function pct(x){return Math.min(100,Math.max(0,Number(x)||0))}
function score(item,after=false){const qty=after&&item.planQty!==undefined?fnum(item.planQty):fnum(item.qty),need=fnum(item.need);const q=after&&item.planQuality!==undefined?fnum(item.planQuality):fnum(item.quality),a=after&&item.planAccess!==undefined?fnum(item.planAccess):fnum(item.access);const coverage=need?Math.min(100,100*qty/need):null;return {coverage,quality:Math.min(100,q*20),access:Math.min(100,a*20),combined:coverage===null?null:Math.round((coverage+q*20+a*20)/3)}}
function status(i,after=false){const s=score(i,after);if(s.combined===null||!i.evidence||i.evidence==='none')return 'Chưa đủ căn cứ';if(s.combined<50)return 'Thiếu nghiêm trọng';if(s.combined<80)return 'Cần cải thiện';return 'Đáp ứng sơ bộ'}
function group(t,after=false){const a=state.items.filter(x=>x.tank===t),v=a.map(x=>score(x,after).combined).filter(x=>x!==null);return {count:a.length,avg:v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null,missing:a.length-v.length}}
function barchart(t,after=false){const g=group(t,after);return `<div class="chartline"><label>${t} · ${F[t].name}</label><div class="bar ${after?'plan':''}"><span style="width:${g.avg??0}%;background:${after?'':F[t].color}"></span></div><span class="percent">${g.avg===null?'N/A':g.avg+'%'}</span></div>`}
function valuation(i){if(i.economicMethod==='notready'||i.economicMethod==='right'||!i.economicMethod)return null;return Math.round(fnum(i.baseBenefit)*pct(i.attribution)/100-fnum(i.cost))}
function lockCandidate(){const rows=state.items.filter(i=>status(i)!=='Chưa đủ căn cứ').map(i=>({i,c:score(i).combined})).sort((a,b)=>a.c-b.c);return rows[0]||null}
function note(key,label,hint=''){return `<div class="field"><label>${label}</label><textarea data-note="${key}">${esc(state.notes[key]||'')}</textarea>${hint?`<span class="help">${hint}</span>`:''}</div>`}
function render(){$('#nav').innerHTML=steps.map((v,i)=>`<button data-tab="${i}" class="${i===tab?'active':''}">${i+1}. ${v.split('|')[0]}<small>${v.split('|')[1]}</small></button>`).join('');$('#main').innerHTML=[activate,paradigm,practise,lens,improve,extract,resolve][tab]()}
function go(i){tab=i;render();try{window.scrollTo({top:0,behavior:'instant'})}catch{}}
function activate(){const c=state.company;return `<div class="eyebrow">BUỔI 24 · BIZCAR FUEL · 6FT</div><h1>Đúng nhiên liệu. Đúng lúc. Thành lực đẩy.</h1><p class="muted">MyBizCar không tăng trưởng chỉ bằng khát vọng hay tiền. CEO phải nhận diện đúng sáu nguồn lực, huy động được chúng và chuyển hóa thành hành động, giá trị và kết quả. Lộ trình: Nhận diện → Đo → Đánh giá → Định giá có điều kiện → Cảnh báo cạn → Thiết kế cách bơm → So sánh trước / sau.</p><div class="card"><h2>Hồ sơ doanh nghiệp</h2><p class="muted">Bối cảnh để đánh giá nguồn lực. Chỉ đánh giá nguồn lực trong quan hệ với Target của chu kỳ.</p><div class="grid"><div class="field"><label>Tên doanh nghiệp / nhóm thực hành</label><input data-co="name" value="${esc(c.name)}" placeholder="VD: Công ty ABC"></div><div class="field"><label>Ngành nghề</label><select data-co="industry">${['','Sản xuất','Xây dựng','Thương mại','Bán lẻ','Nhà hàng – F&B','Khách sạn – Du lịch','Công nghệ – SaaS','Giáo dục – Đào tạo','Nông nghiệp','Dịch vụ chuyên môn','Y tế – Chăm sóc','Logistics','Khác'].map(x=>`<option ${c.industry===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Quy mô</label><select data-co="size">${['','Siêu nhỏ','Nhỏ','Vừa','Lớn','Startup trước tăng trưởng'].map(x=>`<option ${c.size===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Đơn vị tiền tệ</label><select data-co="currency">${['VND','USD'].map(x=>`<option ${c.currency===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Chu kỳ lập kế hoạch</label><select data-co="cycle">${['30 ngày','60 ngày','90 ngày','6 tháng','12 tháng'].map(x=>`<option ${c.cycle===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Mô hình kinh doanh / đặc thù</label><input data-co="model" value="${esc(c.model)}" placeholder="B2B, B2C, dự án, nhượng quyền..."></div></div><div class="field"><label>Target ưu tiên của CEO trong chu kỳ</label><textarea data-co="target" placeholder="VD: Tăng giao hàng đúng hạn từ 85% lên 95% trong 90 ngày">${esc(c.target)}</textarea></div><button class="btn" data-act="saveProfile">Lưu hồ sơ →</button></div><div class="card"><h2>Doanh nghiệp đang thực sự thiếu gì để tăng trưởng?</h2><p class="muted">Tiền chỉ là một nguồn nhiên liệu. Hãy phân biệt: thiếu nguồn lực, dùng sai nguồn lực, hay có nguồn lực nhưng chưa huy động và chuyển hóa được.</p>${note('activate','Ba tín hiệu đang kìm hãm và ba nguồn lực đang tạo lực đẩy (kèm bằng chứng)','Câu hỏi chuyển mô thức: doanh nghiệp đang thiếu nhiên liệu, dùng sai loại nhiên liệu hay có nhiên liệu nhưng chưa chuyển hóa thành lực đẩy?')}</div><div class="callout"><strong>Lưu ý:</strong> Đây là phòng thực hành 6FT, không thay thế quản trị P-Wheel (nhân lực) hoặc F-Wheel (tài lực). T2/T5 là nguồn lực; PW/FW là hệ quản trị chức năng.</div>`}
function paradigm(){return `<h1>Mô thức 6FT · Six Fuel Tanks</h1><p class="muted">Sở hữu nguồn lực chưa phải năng lực tăng trưởng. Nguồn lực chưa được huy động chỉ là tiềm năng; chưa được chuyển hóa thì chưa phải lực đẩy. “Tank” mô tả khả năng tích lũy và sẵn sàng huy động.</p><div class="grid3">${TANKS.map(k=>`<div class="tank" style="border-top:5px solid ${F[k].color}"><span class="tag">${k}</span> <strong>${F[k].name}</strong><div class="tiny muted">${F[k].en}</div><p>${DESC[k]}</p><p class="tiny"><b>Chỉ số gợi ý:</b> ${esc(F[k].metric)}</p><p class="tiny"><b>Dấu hiệu cạn:</b></p><ul>${F[k].signals.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="tiny"><b>Cách bơm:</b> ${F[k].methods.map(esc).join(' · ')}</p></div>`).join('')}</div><div class="grid" style="margin-top:17px"><div class="card"><h3>Ba trạng thái của một nguồn nhiên liệu</h3><p><b>Available</b> — có thể tiếp cận trong hoặc ngoài doanh nghiệp.<br><b>Mobilizable</b> — có quyền, quan hệ, cơ chế và điều kiện để đưa vào sử dụng.<br><b>Convertible</b> — có thể chuyển thành hành động, đầu ra và kết quả cụ thể.</p><h3>Chuỗi chuyển hóa</h3><div class="flow">${['Nhu cầu mục tiêu','Nhận diện','Tiếp cận','Huy động','Tích hợp','Sử dụng','Kết quả','Tái tạo'].map(x=>`<span>${x}</span>`).join('→')}</div></div><div class="card"><h3>Bốn câu hỏi cho mọi nguồn</h3><p>Cần nguồn lực gì? · Đang ở đâu? · Huy động đúng lúc thế nào? · Phải chuyển hóa thành kết quả gì?</p><h3>Huy động mở</h3><p>Không nhất thiết phải sở hữu mọi thứ: tự phát triển · mua · thuê · vay · hợp tác · liên minh · chia sẻ · trao đổi · đồng đầu tư.</p><h3>Nguồn nhiên liệu khóa</h3><p>Một nguồn thiết yếu thiếu có thể dừng hành trình: có tiền và người nhưng thiếu tri thức; có tri thức và tiền nhưng thiếu dữ liệu; có sản phẩm nhưng thiếu niềm tin và quan hệ mở cửa. Không lấy điểm trung bình để che nguồn nhiên liệu khóa.</p></div></div><div class="card"><h3>Cách đo trong studio</h3><p>Đánh giá từng nguồn lực cụ thể, không chấm cảm tính cả bình. Mỗi hồ sơ có: <b>độ phủ</b> = lượng đạt chuẩn / lượng cần cho Target; <b>chất lượng</b> 1–5; <b>khả dụng khi cần</b> 1–5; <b>mức bằng chứng</b>. Chỉ số minh họa = trung bình ba khía cạnh (0–100%): dưới 50% thiếu nghiêm trọng, 50–79% cần cải thiện, từ 80% đáp ứng sơ bộ. Hồ sơ chưa có dữ liệu hoặc chưa đặt nhu cầu là <b>chưa đủ căn cứ</b>, không phải 0.</p><p class="notice">Ước tính giá trị kinh tế chỉ để thảo luận giả định, <b>không phải định giá tài sản kế toán hay giá bán con người/quan hệ</b>. Chỉ số là gợi ý đào tạo, không phải phép đo đã được khoa học kiểm định.</p></div><div class="card"><div class="row between"><div><h2>Thư viện 6FT – 72 loại nguồn lực gợi ý</h2><p class="muted">Danh mục mở, tùy chỉnh theo ngành và mục tiêu. Chọn một mục để khai báo ở bước Practise.</p></div></div>${TANKS.map(k=>`<h3>${k} – ${F[k].name}</h3><div class="libgrid">${F[k].examples.map(e=>`<button class="btn alt smallbtn" data-act="pick" data-tank="${k}" data-name="${esc(e)}">+ ${esc(e)}</button>`).join('')}</div>`).join('')}</div>`}
function practise(){return `<div class="card"><div class="row between"><div><h1>Nhận diện & đo nguồn lực</h1><p class="muted">Chọn từ 72 gợi ý theo sáu bình hoặc tự nhập nguồn lực riêng. Có thể khai báo nhiều nguồn lực trong cùng loại. Với mỗi nguồn: cần gì, đang có gì, huy động từ đâu, bằng chứng là gì?</p></div><div class="row"><button class="btn alt" data-act="library">Khám phá 6 thư viện</button><button class="btn" data-act="add">+ Thêm nguồn lực</button></div></div>${state.company.target?`<p class="notice"><b>Target:</b> ${esc(state.company.target)}</p>`:'<p class="callout warn">Chưa khai báo Target ở bước Activate. Nhu cầu của từng nguồn lực cần đặt theo Target.</p>'}<div class="grid3">${TANKS.map(k=>`<div class="tank"><span class="tag">${k}</span> <strong>${F[k].name}</strong><p class="tiny muted">${F[k].examples.slice(0,3).join(' · ')}…</p><div class="row between"><span class="chip">${group(k).count} hồ sơ</span><button class="btn alt smallbtn" data-act="add" data-tank="${k}">+ Chọn</button></div></div>`).join('')}</div></div><div class="card"><h3>Danh mục đã khai báo (${state.items.length})</h3>${state.items.length?`<div class="tablewrap"><table><tr><th>Bình</th><th>Nguồn lực</th><th>Độ phủ</th><th>Chất / Khả dụng</th><th>Nhận định</th><th>Thao tác</th></tr>${state.items.map(i=>{const s=score(i);return `<tr><td>${i.tank}</td><td><b>${esc(i.name)}</b><div class="muted tiny">${esc(i.category)}</div></td><td>${s.coverage===null?'Chưa đặt nhu cầu':Math.round(s.coverage)+'%'}</td><td>${s.quality}% / ${s.access}%</td><td>${status(i)}</td><td><button class="btn alt smallbtn" data-act="edit" data-id="${esc(i.id)}">Sửa / định giá</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">Chưa có nguồn lực. Chọn một bình và bắt đầu bằng danh mục gợi ý.</div>'}</div>`}
function lens(){const lock=lockCandidate();return `<div class="card"><h1>Bản đồ nguồn lực TRƯỚC thiết kế</h1><p class="muted">Độ đáp ứng sơ bộ theo từng hồ sơ, không phải giá trị tài chính hay “mức xăng” đo được trực tiếp. Chỉ có ý nghĩa trong bối cảnh Target và chuẩn đầu vào.</p><div class="grid"><div><h3>Sáu bình – thực trạng</h3>${TANKS.map(k=>barchart(k)).join('')}</div><div><h3>Tổng quan</h3><div class="grid"><div class="tank"><div class="metric">${state.items.length}</div><span class="muted tiny">Nguồn lực đã khai báo</span></div><div class="tank"><div class="metric">${state.items.filter(i=>status(i)==='Thiếu nghiêm trọng').length}</div><span class="muted tiny">Hồ sơ thiếu nghiêm trọng</span></div><div class="tank"><div class="metric">${state.items.filter(i=>status(i)==='Chưa đủ căn cứ').length}</div><span class="muted tiny">Chưa đủ dữ liệu</span></div><div class="tank"><div class="metric">${state.items.filter(i=>status(i)==='Cần cải thiện').length}</div><span class="muted tiny">Cần cải thiện</span></div></div></div></div><div class="callout"><b>Ứng viên nguồn nhiên liệu khóa:</b> ${lock?`${lock.i.tank} – ${esc(lock.i.name)} (${lock.c}% · ${status(lock.i)}). Kiểm tra xem nguồn này có thực sự làm dừng/chậm Target không.`:'Chưa có hồ sơ đủ căn cứ để xác định.'}</div><div class="callout"><b>Đọc đúng bản đồ:</b> Chỉ số minh họa = trung bình không trọng số của độ phủ lượng, chất lượng và khả dụng ở các hồ sơ có nhu cầu khai báo. Không dùng để kết luận tài sản hoặc định giá doanh nghiệp.</div></div><div class="card"><h3>Nhận diện mạnh / yếu có căn cứ</h3>${state.items.length?`<div class="tablewrap"><table><tr><th>Nguồn lực</th><th>Tình trạng</th><th>Bằng chứng / lý do</th><th>Rủi ro</th><th>Ước tính giá trị</th></tr>${state.items.map(i=>`<tr><td><b>${i.tank}</b> ${esc(i.name)}</td><td>${status(i)}</td><td>${esc(i.reason||'Chưa nhập')}</td><td>${esc(i.risk||'Chưa nhập')}</td><td>${valuation(i)===null?'Chưa định giá':money(valuation(i))+' (ước tính)'}</td></tr>`).join('')}</table></div>`:'<div class="empty">Cần nhập ít nhất một nguồn lực ở bước Practise.</div>'}</div><div class="card"><h3>Bốn lăng kính phản biện nguồn lực</h3><p class="muted">Đừng hỏi “có bao nhiêu”. Hãy hỏi nguồn lực có thật sự cần, có huy động được, có chuyển hóa được và có rủi ro phụ thuộc hay tiêu hao không.</p><div class="grid">${LENSES.map(([a,b])=>`<div class="tank"><b>${a}</b><p class="tiny">${b}</p></div>`).join('')}</div>${note('lens','Phản biện theo bốn lăng kính: nguồn trước đây chưa nhìn thấy, nguồn không cần sở hữu, nguồn đang có nhưng chưa chuyển hóa')}</div>`}
function improve(){return `<div class="card"><h1>Thiết kế cách bơm và chuyển hóa</h1><p class="muted">Chọn nguồn lực muốn làm giàu, phương án bơm, KA và Outcome. Ưu tiên nguồn nhiên liệu khóa. Mục tiêu dự kiến sau thiết kế không phải kết quả đã đạt.</p>${state.items.length?`<div class="row"><button class="btn" data-act="addPlan">+ Tạo phương án bơm</button><button class="btn alt" data-tab="5">Xem bản đồ trước / sau</button></div>`:'<div class="empty">Hãy nhập nguồn lực ở bước Practise trước khi thiết kế phương án.</div>'}</div>${state.plans.map(p=>{const i=state.items.find(x=>x.id===p.itemId);return i?`<div class="card"><div class="row between"><h3>${i.tank} – ${esc(i.name)}</h3><span class="tag">${esc(p.method)}</span></div><p><b>KA:</b> ${esc(p.ka)}</p><p><b>Responses:</b> ${esc(p.responses)}</p><p><b>Outcomes:</b> ${esc(p.outcomes)}</p><p><b>Phụ trách:</b> ${esc(p.owner||'—')} &nbsp; <b>Thời hạn:</b> ${esc(p.deadline)} &nbsp; <b>Ngân sách:</b> ${money(p.budget)}</p>${p.dependencies?`<p><b>Bình bổ trợ:</b> ${esc(p.dependencies)}</p>`:''}${p.risks?`<p><b>Rủi ro:</b> ${esc(p.risks)}</p>`:''}<div class="row"><button class="btn alt smallbtn" data-act="editPlan" data-id="${esc(p.id)}">Sửa phương án</button><button class="btn danger smallbtn" data-act="deletePlan" data-id="${esc(p.id)}">Xóa</button></div></div>`:''}).join('')}`}
function extract(){return `<div class="card"><h1>Trước / sau thiết kế</h1><p class="muted">“Sau” là mức dự kiến do học viên nhập theo phương án bơm; chưa được kiểm chứng.</p><div class="grid"><div><h3>TRƯỚC – Hiện trạng khai báo</h3>${TANKS.map(k=>barchart(k,false)).join('')}</div><div><h3>SAU – Dự kiến theo phương án</h3>${TANKS.map(k=>barchart(k,true)).join('')}</div></div></div><div class="card"><h3>Từng hồ sơ</h3>${state.items.length?`<div class="tablewrap"><table><tr><th>Hồ sơ</th><th>Trước</th><th>Sau dự kiến</th><th>Phương án</th></tr>${state.items.map(i=>{const a=score(i),b=score(i,true),ps=state.plans.filter(p=>p.itemId===i.id);return `<tr><td><b>${i.tank} ${esc(i.name)}</b></td><td>${a.combined===null?'N/A':a.combined+'%'} · ${status(i)}</td><td>${b.combined===null?'N/A':b.combined+'%'}</td><td>${ps.map(p=>esc(p.method)).join('; ')||'Chưa có'}</td></tr>`}).join('')}</table></div>`:'<div class="empty">Chưa có nguồn lực.</div>'}</div><div class="card"><h2>Ba bài học mang theo</h2><p class="muted">Đúc kết nguyên tắc để không nhầm tiền với toàn bộ nhiên liệu, sở hữu với huy động, và huy động với chuyển hóa.</p>${note('extract','Ba bài học (mỗi dòng một bài học)','Gợi ý: tri thức chỉ thành vốn khi được sử dụng và tái tạo · dữ liệu chỉ thành tài sản khi hỗ trợ quyết định · nhân tài chỉ phát huy khi có vai trò, điều kiện và quyền hành động.')}</div>`}
function resolve(){return `<div class="card"><h1>Kích hoạt một nguồn nhiên liệu</h1><p class="muted">Một nguồn ưu tiên · một nguồn lực hiện có cần kích hoạt · một chủ thể cần TrustWorking · một kết quả và một bằng chứng cụ thể. Bảy ngày đầu: hành động kích hoạt; ${esc(state.company.cycle||'90 ngày')}: theo phương án bơm đã thiết kế.</p>${note('resolve','Cam kết: nguồn ưu tiên, cách huy động, người chịu trách nhiệm, kết quả, bằng chứng, thời hạn và ngày xem xét lại')}</div><div class="card"><h3>Lưu và bàn giao bài thực hành</h3><div class="row"><button class="btn" data-act="report">Báo cáo trước / sau</button><button class="btn alt" data-act="export">Xuất JSON</button><button class="btn alt" data-act="import">Nhập bài thực hành</button><button class="btn alt" data-act="csv">Tải bảng CSV</button><button class="btn danger" data-act="reset">Xóa dữ liệu bài này</button></div><p class="help">Nhập được cả tệp JSON xuất từ bản 6FT CEO Lab (ZIP). Nhập sẽ thay toàn bộ dữ liệu 6FT hiện tại sau khi xác nhận.</p></div><div class="callout"><b>Giới hạn:</b> Chỉ số so sánh là gợi ý đào tạo (trung bình ba khía cạnh theo hồ sơ có nhu cầu khai báo), không phải định giá sáu bình bằng tiền và không phải phép đo đã được khoa học kiểm định. Không nhập thông tin cá nhân nhạy cảm.</div>`}
function reportSheet(){const c=state.company;$('#main').innerHTML=`<div class="row no-print"><button class="btn" data-act="print">In / lưu PDF</button><button class="btn alt" data-act="back">Trở lại</button></div><div class="card"><div class="eyebrow">BÁO CÁO THỰC HÀNH CEO · 6FT</div><h2>${esc(c.name||'Doanh nghiệp chưa khai báo')}</h2><p><b>Ngành:</b> ${esc(c.industry||'Chưa có')} · <b>Chu kỳ:</b> ${esc(c.cycle)} · <b>Target:</b> ${esc(c.target||'Chưa khai báo')}</p><div class="grid"><div><h3>TRƯỚC – Hiện trạng khai báo</h3>${TANKS.map(k=>barchart(k,false)).join('')}</div><div><h3>SAU – Dự kiến theo phương án</h3>${TANKS.map(k=>barchart(k,true)).join('')}</div></div><div class="callout"><b>Giới hạn:</b> “Sau” là mức dự kiến do học viên nhập; chưa được kiểm chứng. Không phải định giá sáu bình bằng tiền.</div></div><div class="card"><h3>Danh mục nguồn lực, định giá và cảnh báo</h3><div class="tablewrap"><table><tr><th>Hồ sơ</th><th>Trước</th><th>Sau dự kiến</th><th>Dấu hiệu cạn</th><th>Giá trị kinh tế có điều kiện</th></tr>${state.items.map(i=>{const a=score(i),b=score(i,true);return `<tr><td><b>${i.tank} ${esc(i.name)}</b><div class="tiny muted">${esc(i.rights)}</div></td><td>${a.combined===null?'N/A':a.combined+'%'} · ${status(i)}</td><td>${b.combined===null?'N/A':b.combined+'%'}</td><td>${esc(i.risk||F[i.tank].signals.join('; '))}</td><td>${valuation(i)===null?'Chưa đủ căn cứ / cần chuyên gia':money(valuation(i))+'; '+esc(i.confidence)}</td></tr>`}).join('')}</table></div></div><div class="card"><h3>Kế hoạch bơm và KAROT</h3>${state.plans.length?state.plans.map(p=>{const i=state.items.find(x=>x.id===p.itemId);return `<p><b>${i?.tank||''} – ${esc(i?.name||'')}:</b> ${esc(p.method)}<br><b>KA:</b> ${esc(p.ka)}<br><b>Responses:</b> ${esc(p.responses)}<br><b>Outcomes:</b> ${esc(p.outcomes)}<br><b>Phối hợp:</b> ${esc(p.dependencies)} · <b>Ngân sách:</b> ${money(p.budget)} · <b>Hạn:</b> ${esc(p.deadline)}</p>`}).join('<div class="split"></div>'):'<p>Chưa có phương án.</p>'}</div><div class="card"><h3>Bài học và cam kết</h3><p><b>Bài học:</b> ${esc(state.notes.extract||'Chưa nhập')}</p><p><b>Cam kết:</b> ${esc(state.notes.resolve||'Chưa nhập')}</p></div>`}
function showModal(html){$('#modalContent').innerHTML=html;$('#modalBack').classList.add('open')}
function closeModal(){$('#modalBack').classList.remove('open');editCtx=null;planCtx=null}
function openLibrary(){showModal(`<h2>Thư viện 6FT – 72 loại nguồn lực gợi ý</h2><p class="muted">Danh mục mở: mỗi doanh nghiệp có thể tùy chỉnh theo ngành và mục tiêu.</p>${TANKS.map(k=>`<h3>${k} – ${F[k].name}</h3><div class="libgrid">${F[k].examples.map(e=>`<button class="btn alt smallbtn" data-act="pick" data-tank="${k}" data-name="${esc(e)}">+ ${esc(e)}</button>`).join('')}</div><p class="help">Chỉ số gợi ý: ${esc(F[k].metric)}</p>`).join('')}`)}
function openEditor(eid=null,tank='T1',suggest=''){const found=state.items.find(x=>x.id===eid);const i=found||{id:uid(),tank,category:suggest||F[tank].examples[0],name:suggest,qty:0,need:1,quality:3,access:3,evidence:'partial',reason:'',rights:'',risk:'',unit:'đơn vị',economicMethod:'notready',baseBenefit:0,cost:0,attribution:0,confidence:'Giả định sơ bộ'};editCtx={id:i.id,exists:Boolean(found),draft:i};const cur=state.company.currency||'VND';showModal(`<h2>${found?'Cập nhật':'Thêm'} nguồn lực</h2><p class="muted">Đánh giá một nguồn lực cụ thể, không chấm cảm tính cả bình. Mọi chỉ số phải có đơn vị và mục đích.</p><div class="grid"><div class="field"><label>Bình nhiên liệu</label><select id="ed_tank">${TANKS.map(k=>`<option value="${k}" ${i.tank===k?'selected':''}>${k} – ${F[k].name}</option>`).join('')}</select></div><div class="field"><label>Loại nguồn lực – chọn nhanh</label><select id="ed_category">${categoryOptions(i.tank,i.category)}</select></div><div class="field"><label>Tên nguồn lực cụ thể</label><input id="ed_name" value="${esc(i.name)}" placeholder="VD: Năng lực lập dự toán xây dựng"></div><div class="field"><label>Đơn vị đo</label><input id="ed_unit" value="${esc(i.unit)}" placeholder="quy trình, vị trí, tập dữ liệu..."></div><div class="field"><label>Lượng hiện có đạt chuẩn sơ bộ</label><input type="number" min="0" id="ed_qty" value="${esc(i.qty)}"></div><div class="field"><label>Lượng cần cho Target</label><input type="number" min="0" id="ed_need" value="${esc(i.need)}"></div><div class="field"><label>Chất lượng (1–5)</label><select id="ed_quality">${[1,2,3,4,5].map(x=>`<option ${Number(i.quality)===x?'selected':''} value="${x}">${x} – ${['','Chưa đạt','Yếu','Cơ bản','Tốt','Rất tốt'][x]}</option>`).join('')}</select></div><div class="field"><label>Khả dụng khi cần (1–5)</label><select id="ed_access">${[1,2,3,4,5].map(x=>`<option ${Number(i.access)===x?'selected':''} value="${x}">${x} – ${['','Không thể','Khó','Có điều kiện','Sẵn sàng phần lớn','Sẵn sàng'][x]}</option>`).join('')}</select></div><div class="field"><label>Mức bằng chứng</label><select id="ed_evidence">${EVIDENCE.map(([x,n])=>`<option ${i.evidence===x?'selected':''} value="${x}">${n}</option>`).join('')}</select></div><div class="field"><label>Quyền sử dụng / huy động</label><input id="ed_rights" value="${esc(i.rights)}" placeholder="Sở hữu, cấp phép, hợp đồng, quan hệ tự nguyện..."></div></div><div class="field"><label>Vì sao mạnh/yếu? Bằng chứng, giới hạn và điều chưa biết</label><textarea id="ed_reason">${esc(i.reason)}</textarea></div><div class="field"><label>Dấu hiệu cạn / rủi ro quan sát được</label><textarea id="ed_risk">${esc(i.risk)}</textarea><span class="help" id="ed_signals">Gợi ý: ${F[i.tank].signals.join('; ')}</span></div><div class="split"></div><h3>Ước tính giá trị kinh tế (không bắt buộc)</h3><p class="notice">Dùng để thảo luận giả định, <b>không phải định giá tài sản kế toán hay giá bán con người/quan hệ</b>. Chỉ nhập phần lợi ích có cơ sở quy thuộc, không nhập toàn bộ doanh thu doanh nghiệp.</p><div class="grid"><div class="field"><label>Cách xem xét</label><select id="ed_method">${VALUE_METHODS.map(([x,n])=>`<option ${i.economicMethod===x?'selected':''} value="${x}">${n}</option>`).join('')}</select></div><div class="field"><label>Giá trị/chi phí tham chiếu (${cur})</label><input id="ed_benefit" type="number" min="0" value="${esc(i.baseBenefit)}"></div><div class="field"><label>Chi phí liên quan (${cur})</label><input id="ed_cost" type="number" min="0" value="${esc(i.cost)}"></div><div class="field"><label>Tỷ lệ có thể quy thuộc (%)</label><input id="ed_attr" type="number" min="0" max="100" value="${esc(i.attribution)}"></div></div><div class="field"><label>Căn cứ và giả định định giá</label><input id="ed_conf" value="${esc(i.confidence)}" placeholder="Nguồn, kỳ tính, dữ liệu đối chiếu..."></div><div class="row"><button class="btn" data-act="saveItem">Lưu nguồn lực</button>${found?'<button class="btn danger" data-act="deleteItem">Xóa hồ sơ</button>':''}<button class="btn alt" data-act="close">Hủy</button></div>`)}
function categoryOptions(tank,current){return F[tank].examples.map(x=>`<option ${current===x?'selected':''}>${esc(x)}</option>`).join('')+`<option ${current==='Khác / tự định nghĩa'?'selected':''}>Khác / tự định nghĩa</option>`}
function saveItem(){if(!editCtx)return;const get=k=>$('#ed_'+k).value;const base=editCtx.exists?state.items.find(x=>x.id===editCtx.id):editCtx.draft;const i={...base,id:editCtx.id,tank:get('tank'),category:get('category'),name:get('name').trim()||get('category'),unit:get('unit'),qty:fnum(get('qty')),need:fnum(get('need')),quality:fnum(get('quality')),access:fnum(get('access')),evidence:get('evidence'),rights:get('rights'),reason:get('reason'),risk:get('risk'),economicMethod:get('method'),baseBenefit:fnum(get('benefit')),cost:fnum(get('cost')),attribution:pct(get('attr')),confidence:get('conf')};if(editCtx.exists)state.items=state.items.map(x=>x.id===i.id?i:x);else state.items.push(i);updateProjections();save();closeModal();render()}
function deleteItem(){if(!editCtx||!confirm('Xóa nguồn lực và phương án bơm tương ứng?'))return;const id=editCtx.id;state.items=state.items.filter(i=>i.id!==id);state.plans=state.plans.filter(p=>p.itemId!==id);save();closeModal();render()}
function openPlan(pid=null){const found=state.plans.find(x=>x.id===pid);const p=found||{id:uid(),itemId:(lockCandidate()?.i||state.items[0])?.id,method:'',ka:'',responses:'',outcomes:'',deadline:state.company.cycle,budget:0,dependencies:'',risks:'',owner:'',newQty:'',newQuality:'',newAccess:''};const i=state.items.find(x=>x.id===p.itemId)||state.items[0];if(!i)return;planCtx={id:p.id,exists:Boolean(found)};const cur=state.company.currency||'VND';showModal(`<h2>Thiết kế phương án bơm 6FT</h2><div class="field"><label>Chọn nguồn lực ưu tiên</label><select id="p_item">${state.items.map(x=>`<option value="${esc(x.id)}" ${i.id===x.id?'selected':''}>${x.tank} – ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Cách bơm được gợi ý</label><select id="p_method">${methodOptions(i.tank,p.method)}</select></div><div class="grid"><div class="field"><label>Người phụ trách</label><input id="p_owner" value="${esc(p.owner)}"></div><div class="field"><label>Hạn thực hiện</label><input id="p_deadline" value="${esc(p.deadline)}"></div></div><div class="field"><label>KA – Hành động then chốt</label><textarea id="p_ka" placeholder="Hành động cụ thể, có khả năng tạo Outcome">${esc(p.ka)}</textarea></div><div class="field"><label>Responses – Phản hồi cần theo dõi</label><textarea id="p_responses">${esc(p.responses)}</textarea></div><div class="field"><label>Outcomes – Kết quả kỳ vọng có thể kiểm chứng</label><textarea id="p_outcomes">${esc(p.outcomes)}</textarea></div><div class="field"><label>Bình nguồn lực bổ trợ / điều kiện</label><input id="p_dependencies" value="${esc(p.dependencies)}" placeholder="VD: Dùng T6 huy động chuyên gia để làm giàu T1"></div><div class="field"><label>Rủi ro và ràng buộc</label><input id="p_risks" value="${esc(p.risks)}"></div><div class="field"><label>Ngân sách dự kiến (${cur})</label><input id="p_budget" type="number" min="0" value="${esc(p.budget)}"></div><div class="notice"><b>Trạng thái dự kiến SAU:</b> Nhập mức kỳ vọng có cơ sở, không vượt quá thang tối đa 5 đối với chất / khả dụng. Đây là dự báo để so sánh, chưa phải kết quả kiểm chứng.</div><div class="grid3"><div class="field"><label>Lượng đạt chuẩn dự kiến</label><input id="p_newQty" type="number" min="0" value="${esc(p.newQty)}"></div><div class="field"><label>Chất (1–5) dự kiến</label><input id="p_newQuality" type="number" min="1" max="5" value="${esc(p.newQuality)}"></div><div class="field"><label>Khả dụng (1–5) dự kiến</label><input id="p_newAccess" type="number" min="1" max="5" value="${esc(p.newAccess)}"></div></div><div class="row"><button class="btn" data-act="savePlan">Lưu phương án</button><button class="btn alt" data-act="close">Hủy</button></div>`)}
function methodOptions(tank,current){return F[tank].methods.map(x=>`<option ${current===x?'selected':''}>${esc(x)}</option>`).join('')}
function savePlan(){if(!planCtx)return;const g=x=>$('#p_'+x).value;const p={id:planCtx.id,itemId:g('item'),method:g('method'),owner:g('owner'),deadline:g('deadline'),ka:g('ka'),responses:g('responses'),outcomes:g('outcomes'),dependencies:g('dependencies'),risks:g('risks'),budget:fnum(g('budget')),newQty:g('newQty'),newQuality:g('newQuality'),newAccess:g('newAccess')};if(!p.ka.trim()){alert('Cần nhập KA.');return}if(planCtx.exists)state.plans=state.plans.map(x=>x.id===p.id?p:x);else state.plans.push(p);updateProjections();save();closeModal();render()}
function updateProjections(){state.items.forEach(i=>{delete i.planQty;delete i.planQuality;delete i.planAccess;for(const p of state.plans.filter(x=>x.itemId===i.id)){if(p.newQty!==''&&p.newQty!=null)i.planQty=fnum(p.newQty);if(p.newQuality!==''&&p.newQuality!=null)i.planQuality=Math.min(5,fnum(p.newQuality));if(p.newAccess!==''&&p.newAccess!=null)i.planAccess=Math.min(5,fnum(p.newAccess))}})}
function deletePlan(id){if(!confirm('Xóa phương án?'))return;state.plans=state.plans.filter(x=>x.id!==id);updateProjections();save();render()}
function saveProfile(){$$('[data-co]').forEach(e=>state.company[e.dataset.co]=e.value);save();go(1)}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='6FT-MyBizCar-'+(state.company.name||'ceo').replace(/[^a-zA-Z0-9_-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadCSV(){const rows=[['Bình','Tên nguồn lực','Loại','Lượng','Nhu cầu','Chất 1-5','Khả dụng 1-5','Bằng chứng','Lý do','Rủi ro','Định giá dự kiến']];state.items.forEach(i=>rows.push([i.tank,i.name,i.category,i.qty,i.need,i.quality,i.access,i.evidence,i.reason,i.risk,valuation(i)??'']));const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='6ft_nguon_luc.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importFile(ev){try{const f=ev.target.files[0];if(!f)return;if(f.size>20000000)throw Error('Tệp quá 20 MB');const x=upgrade(JSON.parse(await f.text()));if(!valid(x))throw Error('Không đúng dữ liệu 6FT');if(confirm('Nhập sẽ thay toàn bộ dữ liệu 6FT hiện tại. Bạn đã xuất bản sao lưu chưa?')){state=x;updateProjections();save();render();alert('Đã nhập bài thực hành')}}catch(err){alert('Không nhập: '+err.message)}ev.target.value=''}
function resetAll(){if(confirm('Xóa toàn bộ hồ sơ 6FT của bài này?')){state=blank();save();go(0)}}
const ACTIONS={close:closeModal,saveProfile,library:openLibrary,add:b=>openEditor(null,b.dataset.tank||'T1'),pick:b=>{tab=2;render();openEditor(null,b.dataset.tank,b.dataset.name)},edit:b=>openEditor(b.dataset.id),saveItem,deleteItem,addPlan:()=>openPlan(),editPlan:b=>openPlan(b.dataset.id),deletePlan:b=>deletePlan(b.dataset.id),savePlan,report:reportSheet,back:render,print:()=>window.print(),export:exportJSON,import:()=>$('#file').click(),csv:downloadCSV,reset:resetAll};
function onClick(ev){const t=ev.target.closest('[data-tab]');if(t&&!t.closest('#modalBack')){go(+t.dataset.tab);return}const b=ev.target.closest('[data-act]');if(b&&ACTIONS[b.dataset.act]){ev.preventDefault();ACTIONS[b.dataset.act](b)}else if(ev.target.id==='modalBack')closeModal()}
$('#nav').addEventListener('click',onClick);$('#main').addEventListener('click',onClick);$('#modalBack').addEventListener('click',onClick);
$('#main').addEventListener('input',ev=>{const e=ev.target;if(e.dataset.note){state.notes[e.dataset.note]=e.value;clearTimeout(noteTimer);noteTimer=setTimeout(save,400)}else if(e.dataset.co){state.company[e.dataset.co]=e.value;clearTimeout(noteTimer);noteTimer=setTimeout(save,400)}});
$('#modalBack').addEventListener('change',ev=>{if(ev.target.id==='ed_tank'){const k=ev.target.value;$('#ed_category').innerHTML=categoryOptions(k,'');$('#ed_signals').textContent='Gợi ý: '+F[k].signals.join('; ')}else if(ev.target.id==='ed_category'&&!$('#ed_name').value.trim()){$('#ed_name').value=ev.target.value}else if(ev.target.id==='p_item'){const i=state.items.find(x=>x.id===ev.target.value);if(i)$('#p_method').innerHTML=methodOptions(i.tank,'')}});
$('#export').onclick=exportJSON;$('#import').onclick=()=>$('#file').click();$('#file').onchange=importFile;$('#report').onclick=reportSheet;$('#csv').onclick=downloadCSV;
render();
</script></body></html>
