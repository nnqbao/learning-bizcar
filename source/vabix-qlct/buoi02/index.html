      {key:'C',name:'CORE',vi:'Nguồn lực cốt lõi',nature:'Những năng lực doanh nghiệp cần trực tiếp sở hữu, phát triển và giữ lại vì gắn với lợi thế cạnh tranh, bí quyết, chất lượng, độ tin cậy và khả năng học hỏi dài hạn.',when:'Nên giữ Core cao khi công việc chứa know-how, ảnh hưởng mạnh đến chất lượng, khó thay thế nhanh hoặc cần tích lũy kinh nghiệm lâu dài.',highRisk:'Core quá cao làm bộ máy nặng, tăng chi phí cố định, kém linh hoạt và dùng người giỏi cho cả việc không còn chiến lược.',lowRisk:'Core quá thấp làm mất bí quyết, phụ thuộc bên ngoài, giảm năng lực học hỏi và kiểm soát.',example:'Năng lực kiểm soát một công đoạn then chốt ảnh hưởng trực tiếp chất lượng sản phẩm nên có tỷ trọng Core cao.'},
      {key:'O',name:'OPEN',vi:'Nguồn lực mở',nature:'Nguồn lực được huy động linh hoạt từ chuyên gia, đối tác, cộng tác viên, nhà cung cấp dịch vụ, lao động thời vụ hoặc liên kết bên ngoài.',when:'Phù hợp khi nhu cầu biến động, chuyên môn hiếm, thời gian sử dụng ngắn, hoặc thuê ngoài hiệu quả hơn duy trì cố định.',highRisk:'Open quá cao có thể làm doanh nghiệp phụ thuộc bên ngoài, rò rỉ tri thức và khó tích lũy năng lực nội bộ.',lowRisk:'Open quá thấp khiến tổ chức tự làm mọi thứ, khó tiếp cận năng lực mới và thiếu linh hoạt.',example:'Một dự án chỉ cần chuyên gia trong 3 tháng có thể dùng Open thay vì tuyển một vị trí cố định.'},
      {key:'D',name:'DIGITAL',vi:'Nguồn lực số',nature:'Phần công việc được phần mềm, dữ liệu, tự động hóa, AI hoặc hệ thống số hỗ trợ hay thay thế thao tác thủ công.',when:'Phù hợp với việc lặp lại, chuẩn hóa được, nhiều dữ liệu, ít cần phán đoán con người hoặc đang gây lãng phí thời gian.',highRisk:'Digital tăng nhanh nhưng thiếu quản trị có thể tạo phụ thuộc hệ thống, dữ liệu sai, rủi ro bảo mật và khoảng trống năng lực số.',lowRisk:'Digital quá thấp khiến con người bị giữ trong việc lặp lại, chậm, dễ sai và phải tuyển thêm cho những việc có thể tự động hóa.',example:'Một nhân viên mất 2 giờ mỗi ngày tổng hợp báo cáo thủ công; dashboard tự động có thể chuyển phần việc đó từ Core sang Digital.'}

      {key:'R',name:'RELATIONAL',vi:'Năng lực quan hệ & phối hợp',nature:'Niềm tin rằng lãnh đạo, tổ chức và đồng đội có khả năng giao tiếp, lắng nghe, chia sẻ thông tin và phối hợp để cùng tạo kết quả.',good:'Thông tin chuyển đúng lúc; phối hợp không cần quản lý đứng giữa; tranh luận vấn đề mà không công kích con người.',lost:'Giữ thông tin; đổ lỗi; “việc ai người đó làm”; phải nhờ cấp trên can thiệp mới phối hợp.',impact:'Relational yếu làm tăng thời gian chờ, xung đột, lỗi liên phòng ban và giảm năng suất toàn chuỗi.',example:'Một kỹ sư rất giỏi nhưng không chia sẻ thay đổi kịp thời cho sản xuất: Competence cao nhưng Relational thấp vẫn gây tổn thất.'},
      {key:'I',name:'INTEGRITY',vi:'Chính trực & độ tin cậy',nature:'Niềm tin rằng thông tin, cam kết và hành vi phản ánh đúng thực tế; người trong hệ thống không cố tình làm méo sự thật vì lợi ích riêng.',good:'Báo sớm sai lệch; dữ liệu đáng tin; giữ cam kết; nhận phần trách nhiệm thuộc vai trò.',lost:'Báo cáo đẹp hơn thực tế; chỉ báo vấn đề khi không thể giấu; dữ liệu giữa các nguồn không nhất quán.',impact:'Integrity yếu rất nguy hiểm vì quản lý có thể ra quyết định đúng trên một bức tranh sai.',example:'Khi phát hiện sai lệch, một người báo ngay; người khác chờ xem có ai phát hiện không. Hai người có thể ngang chuyên môn nhưng rất khác Integrity.'},

    factors:[

function personName(id){const p=board.roster.find(x=>x.id===Number(id));return p?p.name:(Number(id)===ME.id?ME.name:`Học viên #${id}`);}
/** Rebuild the screens' `state` from the board rows (same shape the original demo kept in the browser). */
function syncState(){
  const rows=board.rows(),by=k=>rows.filter(r=>r.kind===k);
  memberOf=new Map(by('member').map(r=>[Number(r.key),Number(r.data.groupId)]));
  const votes=[0,0,0,0,0];by('vote').forEach(r=>{const c=Number(r.data.choice);if(c>=0&&c<votes.length)votes[c]++;});
  const mine=by('vote').find(r=>r.key===String(ME.id));myVote=mine?Number(mine.data.choice):null;
  state={
    activateVotes:votes,
    groups:GROUPS.map(g=>{const doc=(by('group').find(r=>r.key===String(g.id))||{}).data||{};const v1=Object.assign({locked:false,data:{}},doc.v1||{});v1.data=v1.data||{};const v2=Object.assign({locked:false,lensUsed:'',changes:'',basis:'',finalPlan:'',target90:''},doc.v2||{});const memberIds=[...memberOf].filter(([,x])=>x===g.id).map(([u])=>u);return Object.assign({},g,{doc,memberIds,members:v1.data.members||memberIds.map(personName).join('\n'),presenter:v1.data.presenter||'',v1,v2});}),
    lenses:by('lens').map(r=>Object.assign({id:r.key,userId:r.userId},r.data)).sort((a,b)=>String(a.at).localeCompare(String(b.at))),
    extracts:by('extract').map(r=>Object.assign({},r.data,{userId:Number(r.key),student:personName(r.key)})),
    resolves:by('resolve').map(r=>Object.assign({},r.data,{userId:Number(r.key),student:personName(r.key)}))
  };
  myGroupId=memberOf.get(ME.id)||null;
}
function canEditGroup(g){return STAFF||myGroupId===g.id;}
function teacherView(){return STAFF&&ui.mode==='teacher';}
function errorText(code){return ({NOT_IN_GROUP:'Bạn chưa thuộc nhóm này. Chọn nhóm của mình ở PRACTISE hoặc nhờ giảng viên xếp nhóm.',LOCKED:'Bản này đã chốt. Chỉ giảng viên mở khóa được.',FORBIDDEN:'Bạn không có quyền sửa nội dung này.',EXPIRED:'Phiên làm việc đã hết hạn. Tải lại trang để tiếp tục.',TOO_LARGE:'Nội dung quá dài.',OFFLINE:'Chưa kết nối được máy chủ. Nội dung chưa được lưu, hãy thử lại.'})[code]||'Chưa lưu được. Hãy thử lại.';}
function toast(text){const t=qs('qbToast');if(!t)return;t.textContent=text;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600);}
async function put(kind,key,data,okText){const res=await board.put(kind,key,data);if(!res.ok){alert(errorText(res.error));return false;}ui.dirty=false;if(okText)toast(okText);syncState();renderRoute();return true;}
async function del(kind,key){const res=await board.del(kind,key);if(!res.ok){alert(errorText(res.error));return false;}syncState();renderRoute();return true;}
function navTo(route){ui.route=route;ui.dirty=false;try{window.sessionStorage.setItem('qlct-b02-route',route);}catch(e){}render();try{root.scrollIntoView({block:'start',behavior:'smooth'});}catch(e){}}

function groupPanel(){

  if(STAFF)return '';
  if(myGroupId){const g=groupById(myGroupId);return `<div class="notice">Bạn thuộc <strong>${h(g.name)} – ${h(g.label)}</strong>. Bạn sửa được bài nhóm mình; nhóm khác chỉ xem. <button type="button" class="btn ghost small" data-change-group>Đổi nhóm</button></div>`;}
  return `<div class="card pick-group"><h3>Bạn thuộc nhóm nào?</h3><p class="muted">Chọn đúng nhóm giảng viên đã xếp. Giảng viên có thể điều chỉnh lại.</p><div class="actions">${state.groups.map(g=>`<button type="button" class="btn" data-join="${g.id}">${h(g.name)} – ${h(g.label)}</button>`).join('')}</div></div><div class="spacer"></div>`;
}
function bindGroupPanel(){
  root.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{ui.activeGroup=Number(b.dataset.join);put('member',String(ME.id),{groupId:Number(b.dataset.join)},'Đã vào nhóm.');});
  root.querySelectorAll('[data-change-group]').forEach(b=>b.onclick=()=>{if(confirm('Đổi nhóm? Bạn sẽ chọn lại nhóm của mình.'))del('member',String(ME.id));});
  root.querySelectorAll('[data-assign]').forEach(s=>s.onchange=()=>s.value?put('member',s.dataset.assign,{groupId:Number(s.value)},'Đã xếp nhóm.'):del('member',s.dataset.assign));

function activate(){const a=CONTENT.activate,total=state.activateVotes.reduce((s,x)=>s+x,0);return shell('CÙNG KHỞI ĐỘNG','ACTIVATE • 5 PHÚT',`<div class="case"><h3>${a.headline}</h3>${a.caseText.map(p=>`<p>${p}</p>`).join('')}<div class="big-question">${a.question}</div><div class="grid two">${a.choices.map((c,i)=>`<button class="card domain activate-choice ${myVote===i?'mine':''}" data-choice="${i}"><strong>${String.fromCharCode(65+i)}.</strong> ${h(c)}</button>`).join('')}</div></div><div class="spacer"></div><div class="teacher-only card"><h3>Kết quả nhanh của lớp</h3>${a.choices.map((c,i)=>{const pct=total?Math.round(state.activateVotes[i]/total*100):0;return `<div style="margin:10px 0"><strong>${String.fromCharCode(65+i)}. ${h(c)}</strong><div class="bar10"><span style="width:${pct}%"></span></div><div class="mini">${state.activateVotes[i]} lượt • ${pct}%</div></div>`}).join('')}</div><div class="spacer"></div><div class="quote"><strong>Câu chuyển:</strong> ${a.bridge}</div>`,'Không công bố “đáp án đúng” ở Activate; dùng tình huống để tạo nhu cầu khám phá mô thức mới.');}
function bindActivate(){root.querySelectorAll('.activate-choice').forEach(b=>b.onclick=()=>{if(STAFF)return toast('Giảng viên xem kết quả bên dưới; học viên bình chọn trên máy của mình.');put('vote',String(ME.id),{choice:Number(b.dataset.choice)},'Đã ghi nhận lựa chọn của bạn.');});}

function wheel(){return shell('BÁNH XE NHÂN LỰC','PARADIGM • MÔ THỨC TỔNG',`<div class="wheel-wrap"><div class="wheel-visual"><div class="wheel-ring tread"></div><div class="wheel-ring casing"></div><div class="wheel-ring air"></div><div class="wheel-ring rim"><div><div>COD</div><small>MÂM</small></div></div><div class="wheel-label tread">GAI • MAPY</div><div class="wheel-label casing">VỎ • WSC</div><div class="wheel-label air">HƠI • CRISS</div></div><div><div class="big-question">${CONTENT.wheel.statement}</div><div class="spacer"></div>${CONTENT.wheel.components.map(x=>`<div class="card domain" style="margin-bottom:10px" data-route="${x.id}"><div class="framework-sub">${x.en}</div><h3>${x.vi} • ${x.code}</h3><p>${x.question}</p><div class="mini">${x.summary}</div></div>`).join('')}</div></div><div class="quote"><strong>Câu khóa:</strong> Quản trị nhân lực không chỉ là quản con người. Đó là thiết kế một Bánh xe Nhân lực đủ MÂM – đủ HƠI – bền VỎ – bám GAI để đội ngũ tự tạo kết quả.</div>`);}

function factorCard(f){return `<div class="lesson-panel"><div class="lesson-title"><div class="framework-sub">${h(f.key)}</div><h3>${h(f.name)}</h3><p>${h(f.vi||'')}</p></div><div class="lesson-body"><details class="accordion" open><summary>Bản chất</summary><p>${h(f.nature)}</p></details>${f.when?`<details class="accordion"><summary>Khi nào nên dùng / tăng?</summary><p>${h(f.when)}</p></details>`:''}${f.good?`<details class="accordion"><summary>Dấu hiệu đủ hơi</summary><p>${h(f.good)}</p></details>`:''}${f.lost?`<details class="accordion"><summary>Dấu hiệu mất hơi</summary><p>${h(f.lost)}</p></details>`:''}${f.energy?`<details class="accordion"><summary>Trải nghiệm tạo năng lượng</summary>${list(f.energy)}</details>`:''}${f.stress?`<details class="accordion"><summary>Trải nghiệm tạo stress / ma sát</summary>${list(f.stress)}</details>`:''}${f.highRisk?`<details class="accordion"><summary>Rủi ro khi quá cao</summary><p>${h(f.highRisk)}</p></details>`:''}${f.lowRisk?`<details class="accordion"><summary>Rủi ro khi quá thấp</summary><p>${h(f.lowRisk)}</p></details>`:''}${f.impact?`<details class="accordion"><summary>Tác động khi yếu</summary><p>${h(f.impact)}</p></details>`:''}${f.detail?`<details class="accordion"><summary>Chi tiết</summary><p>${h(f.detail)}</p></details>`:''}<details class="accordion"><summary>Ví dụ minh họa</summary><div class="callout">${h(f.example||'')}</div></details></div></div>`}

function rim(){const r=CONTENT.rim;return shell('MÂM NHÂN LỰC – COD','PARADIGM • P-RIM',`<div class="component-banner"><div class="component-icon">COD</div><div><div class="framework-sub">CORE • OPEN • DIGITAL</div><h2>MÂM NHÂN LỰC</h2><p>${r.intro}</p></div></div><div class="spacer"></div><div class="warning callout"><strong>Tỷ trọng COD theo %:</strong> ${r.ratioNote}</div><div class="grid three">${r.factors.map(f=>factorCard(f)).join('')}</div><div class="spacer"></div><div class="card"><h3>PHÂN TÍCH TỶ TRỌNG C–O–D</h3><div class="form-grid"><div class="field"><label>CURRENT – Core %</label><input id="demo_c" type="number" min="0" max="100" value="80"></div><div class="field"><label>CURRENT – Open %</label><input id="demo_o" type="number" min="0" max="100" value="10"></div><div class="field"><label>CURRENT – Digital %</label><input id="demo_d" type="number" min="0" max="100" value="10"></div><div class="field"><label>Mẫu số</label><select id="demo_basis"><option>Khối lượng công việc</option><option>Chi phí nguồn lực</option><option>Số nhiệm vụ / quy trình</option></select></div></div><div class="spacer"></div><div id="codDemo"></div></div><div class="spacer"></div><div class="grid two">${r.examples.map(e=>`<div class="card"><h3>${e.title}</h3><p><strong>Mẫu số:</strong> ${e.basis}</p><div class="cod-stack"><span class="cod-core" style="width:${e.current[0]}%">C ${e.current[0]}%</span><span class="cod-open" style="width:${e.current[1]}%">O ${e.current[1]}%</span><span class="cod-digital" style="width:${e.current[2]}%">D ${e.current[2]}%</span></div><p class="mini">HIỆN TẠI</p><div class="cod-stack"><span class="cod-core" style="width:${e.target[0]}%">C ${e.target[0]}%</span><span class="cod-open" style="width:${e.target[1]}%">O ${e.target[1]}%</span><span class="cod-digital" style="width:${e.target[2]}%">D ${e.target[2]}%</span></div><p class="mini">MONG MUỐN</p><div class="callout">${e.why}</div></div>`).join('')}</div><div class="spacer"></div><div class="card"><h3>CÂU HỎI TỰ SOI</h3>${list(r.questions)}</div><div class="quote"><strong>Nguyên tắc:</strong> COD không nhằm tối đa hóa Digital hay tối thiểu hóa Core. COD nhằm tìm ra cơ cấu nguồn lực phù hợp nhất để tạo kết quả.</div>`);}
function bindRimDemo(){const update=()=>{const c=num(val('demo_c')),o=num(val('demo_o')),d=num(val('demo_d')),t=c+o+d;qs('codDemo').innerHTML=`<div class="cod-stack"><span class="cod-core" style="width:${c}%">C ${c}%</span><span class="cod-open" style="width:${o}%">O ${o}%</span><span class="cod-digital" style="width:${d}%">D ${d}%</span></div><p class="${t===100?'status':'status locked'}">Tổng = ${t}% ${t===100?'✓':'• Cần bằng 100%'}</p>`};['demo_c','demo_o','demo_d'].forEach(id=>qs(id).oninput=update);update();}

function air(){const a=CONTENT.air;return shell('HƠI NHÂN LỰC – CRISS','PARADIGM • P-AIR',`<div class="component-banner"><div class="component-icon">CRISS</div><div><div class="framework-sub">COD TIN VÀO LÃNH ĐẠO • CÔNG TY • NHAU</div><h2>HƠI NHÂN LỰC</h2><p>${a.intro}</p></div></div><div class="spacer"></div><div class="grid three">${a.trustTargets.map(x=>`<div class="card"><h3>COD tin vào ${x}</h3><p>Soi CRISS: Competence • Relational • Integrity • System • Strategic Trust.</p></div>`).join('')}</div><div class="spacer"></div><div class="dangerbox callout"><strong>Dấu hiệu “mất hơi”:</strong>${list(a.lostAirSigns)}</div><div class="spacer"></div><div class="grid two">${a.factors.map(f=>factorCard(f)).join('')}</div><div class="spacer"></div><div class="card"><h3>MA TRẬN NIỀM TIN CRISS – VÍ DỤ MINH HỌA</h3>${airMatrixTable(a.matrixExample)}<p class="mini">Thang 1–10. Đây là dữ liệu minh họa để học cách đọc mô thức, không phải đánh giá thực tế Công ty.</p></div><div class="warning callout"><strong>Đừng chỉ nhìn điểm trung bình:</strong> ${a.note}</div><div class="quote"><strong>Câu khóa:</strong> COD có thể đủ người, đủ năng lực, nhưng nếu không còn tin vào lãnh đạo, công ty và nhau thì Bánh xe Nhân lực vẫn MẤT HƠI.</div>`);}
function airMatrixTable(m){const rows=[['C','Competence'],['R','Relational'],['I','Integrity'],['S1','System'],['S2','Strategic Trust']];return `<div class="table-wrap"><table class="matrix"><thead><tr><th>CRISS</th><th>Lãnh đạo</th><th>Công ty</th><th>Nhau</th><th>TB</th></tr></thead><tbody>${rows.map(([k,n])=>`<tr><th>${n}</th><td>${m[k][0]}</td><td>${m[k][1]}</td><td>${m[k][2]}</td><td><strong>${avg(m[k])}</strong></td></tr>`).join('')}</tbody></table></div>`}

function casing(){const c=CONTENT.casing;return shell('VỎ NHÂN LỰC – WSC','PARADIGM • P-CASING',`<div class="component-banner"><div class="component-icon">WSC</div><div><div class="framework-sub">WORKEX • SERVEX • COMMEX</div><h2>VỎ NHÂN LỰC</h2><p>${c.intro}</p></div></div><div class="spacer"></div><div class="grid three">${c.factors.map(f=>factorCard(f)).join('')}</div><div class="spacer"></div><div class="science-note"><strong>Ghi chú khoa học:</strong> ${c.scienceNote}</div><div class="spacer"></div><div class="card"><h3>NHẬN DIỆN VỎ NỨT</h3><table class="compact-table"><thead><tr><th>Trải nghiệm</th><th>Điều đang tạo năng lượng</th><th>Điều đang gây stress / ma sát</th><th>Câu hỏi lãnh đạo</th></tr></thead><tbody><tr><td><strong>WorkEX</strong></td><td>Rõ việc, tiến bộ, chủ động, ghi nhận</td><td>Mơ hồ, gián đoạn, sợ sai, kiểm tra quá mức</td><td>Nhân viên đang chiến đấu với công việc hay còn phải chiến đấu với chính cách tổ chức công việc?</td></tr><tr><td><strong>ServEX</strong></td><td>Quan tâm, hỗ trợ, kết nối, tiện lợi</td><td>Chờ đợi, đùn đẩy, thủ tục nặng</td><td>COD có được phục vụ đủ tốt để tập trung tạo giá trị?</td></tr><tr><td><strong>CommEX</strong></td><td>Thông tin rõ, đúng, có ý nghĩa và ghi nhận</td><td>Tin mơ hồ, chỉ phê bình, thay đổi không giải thích</td><td>COD mỗi ngày đang nghe những tín hiệu làm họ muốn tiến lên hay co lại?</td></tr></tbody></table></div><div class="quote"><strong>Câu khóa:</strong> Nhân viên không chỉ làm việc trong doanh nghiệp. Họ đang TRẢI NGHIỆM doanh nghiệp mỗi ngày.</div>`);}

function tread(){const t=CONTENT.tread;return shell('GAI NHÂN LỰC – MAPY','PARADIGM • P-TREAD',`<div class="component-banner"><div class="component-icon">MAPY</div><div><div class="framework-sub">MOTIVATION • ADVANTAGE • PRIDE • YIELD</div><h2>GAI NHÂN LỰC</h2><p>${t.intro}</p></div></div><div class="spacer"></div><div class="grid four">${t.factors.map(f=>factorCard(f)).join('')}</div><div class="spacer"></div><div class="dangerbox callout"><strong>Dấu hiệu mòn gai:</strong>${list(t.wornSigns)}</div><div class="spacer"></div><div class="section-head"><div><div class="kicker">M – MOTIVATION</div><h2>6M – SÁU NGUỒN ĐỘNG LỰC</h2></div><p>Lãnh đạo tác động đúng M để tăng độ bám và cống hiến của COD.</p></div><div class="grid three">${t.sixM.map(m=>`<div class="card"><div class="framework-code" style="font-size:28px">${m.key}</div><h3>${m.vi}</h3><p><strong>Khi mạnh:</strong> ${m.high}</p><p><strong>Khi mòn:</strong> ${m.worn}</p><div class="callout"><strong>Lãnh đạo làm gì?</strong><br>${m.leader}</div><div class="mini"><strong>Ví dụ:</strong> ${m.example}</div></div>`).join('')}</div><div class="spacer"></div><div class="quote"><strong>Chuỗi tác động Mastery:</strong> Dạy & coaching → năng lực tăng → cảm giác tiến bộ → Mastery tăng → độ bám tăng → cống hiến tăng → Yield tăng.</div><div class="quote"><strong>Câu khóa:</strong> GAI cho biết COD đang bám vào doanh nghiệp bằng lực nào, đang mòn ở đâu và cần gia tăng điểm bám nào để chuyển năng lực thành YIELD.</div>`);}

function practise(){const g=groupById(ui.activeGroup);return shell('THỰC HÀNH 04 NHÓM','PRACTISE',`${groupPanel()}<div class="quote"><strong>04 nhóm – 04 cấu kiện:</strong> Nhận diện → Đo lường 1–10 → Đánh giá → Kế hoạch gia tăng. Sau khi hoàn thành, website tự tổng hợp để PITCH NGAY hoặc xuất PPTX.</div><div class="practice-nav">${state.groups.map(x=>`<button class="${x.id===ui.activeGroup?'active':''}" data-group="${x.id}">${x.name}${x.id===myGroupId?' · nhóm tôi':''}<br><small>${x.label}</small></button>`).join('')}</div>${pendingBar()}${practiceForm(g)}`,'PRACTISE chỉ trình bày phương án nhóm. Góc nhìn bổ sung nằm ở LENS.');}
function commonGroupFields(g,d){return `<div class="form-grid"><div class="field"><label>Tên nhóm</label><input name="groupName" value="${sv(d,'groupName',g.name)}"></div><div class="field"><label>Người pitching</label><input name="presenter" value="${sv(d,'presenter',g.presenter)}"></div><div class="field full"><label>Thành viên nhóm</label><textarea name="members" placeholder="Mỗi người một dòng">${sv(d,'members',g.members)}</textarea></div></div>`}
function num10(name,v){return `<input type="number" name="${name}" min="1" max="10" value="${sv(v,'',v||'')}">`}
function commonAssessment(d){return `<div class="form-grid"><div class="field"><label>Điểm cấu kiện hiện tại (1–10)</label><input type="number" name="overallCurrent" min="1" max="10" value="${sv(d,'overallCurrent')}"></div><div class="field"><label>Mức mong muốn</label><input type="number" name="overallTarget" min="1" max="10" value="${sv(d,'overallTarget')}"></div><div class="field full"><label>Điểm mạnh đang có</label><textarea name="strengths">${sv(d,'strengths')}</textarea></div><div class="field full"><label>Điểm yếu / khoảng trống chính</label><textarea name="gaps">${sv(d,'gaps')}</textarea></div><div class="field full"><label>Tác động nếu không cải thiện</label><textarea name="impact">${sv(d,'impact')}</textarea></div><div class="field full"><label>Kế hoạch gia tăng ưu tiên</label><textarea name="plan">${sv(d,'plan')}</textarea></div><div class="field"><label>Người chịu trách nhiệm</label><input name="owner" value="${sv(d,'owner')}"></div><div class="field"><label>Thời hạn</label><input name="deadline" value="${sv(d,'deadline')}"></div><div class="field full"><label>Chỉ báo / bằng chứng cải thiện</label><textarea name="indicator">${sv(d,'indicator')}</textarea></div></div>`}
function practiceForm(g){const d=g.v1.data||{};let specific='';if(g.component==='rim')specific=rimPractice(d);if(g.component==='air')specific=airPractice(d);if(g.component==='casing')specific=casingPractice(d);if(g.component==='tread')specific=treadPractice(d);return `<form id="practiceForm" class="card"><div class="section-head"><div><div class="kicker">${g.name}</div><h2>${g.label}</h2></div><span class="${g.v1.locked?'status locked':'status'}">${g.v1.locked?'ĐÃ CHỐT V1':'ĐANG THỰC HÀNH'}</span></div>${commonGroupFields(g,d)}<div class="spacer"></div>${specific}<div class="spacer"></div>${commonAssessment(d)}<div class="actions no-print"><button type="button" class="btn" id="saveV1" ${g.v1.locked?'disabled':''}>Lưu bài nhóm</button><button type="button" class="btn gold" id="lockV1" ${g.v1.locked?'disabled':''}>CHỐT V1</button><button type="button" class="btn secondary" id="pitchNow">PITCH NGAY</button><button type="button" class="btn ghost" id="exportPptx">Xuất PPTX</button></div><div class="mini-note">Bài nhóm lưu chung cho cả nhóm và đồng bộ với cả lớp; thành viên khác thấy sau vài giây.</div></form>`}
function rimPractice(d){return `<h3>1. NHẬN DIỆN & ĐO TỶ TRỌNG COD</h3><div class="form-grid"><div class="field"><label>Mẫu số phân tích</label><select name="basis"><option ${selected(d.basis,'Khối lượng công việc')}>Khối lượng công việc</option><option ${selected(d.basis,'Chi phí nguồn lực')}>Chi phí nguồn lực</option><option ${selected(d.basis,'Số nhiệm vụ / quy trình')}>Số nhiệm vụ / quy trình</option></select></div><div class="field"><label>Căn cứ chọn mẫu số</label><input name="basisWhy" value="${sv(d,'basisWhy')}"></div></div><table class="matrix"><thead><tr><th>COD</th><th>Hiện tại %</th><th>Mong muốn %</th><th>Nhận diện / căn cứ</th></tr></thead><tbody>${[['C','Core'],['O','Open'],['D','Digital']].map(([k,n])=>`<tr><th>${n}</th><td><input type="number" min="0" max="100" name="${k}_cur" value="${sv(d,k+'_cur')}"></td><td><input type="number" min="0" max="100" name="${k}_tgt" value="${sv(d,k+'_tgt')}"></td><td><textarea name="${k}_why">${sv(d,k+'_why')}</textarea></td></tr>`).join('')}</tbody></table><div id="codPracticeCheck" class="mini-note"></div>`}
function airPractice(d){const factors=[['C','Competence'],['R','Relational'],['I','Integrity'],['S1','System'],['S2','Strategic Trust']],targets=[['L','Lãnh đạo'],['C','Công ty'],['N','Nhau']];return `<h3>1. NHẬN DIỆN & ĐO NIỀM TIN CRISS</h3><p class="mini">Mỗi ô 1–10: COD tin vào CRISS của Lãnh đạo, Công ty và Nhau đến mức nào?</p><div class="table-wrap"><table class="matrix"><thead><tr><th>CRISS</th>${targets.map(x=>`<th>${x[1]}</th>`).join('')}<th>Căn cứ / dấu hiệu mất hơi</th></tr></thead><tbody>${factors.map(([fk,fn])=>`<tr><th>${fn}</th>${targets.map(([tk])=>`<td><input type="number" min="1" max="10" name="air_${fk}_${tk}" value="${sv(d,'air_'+fk+'_'+tk)}"></td>`).join('')}<td><textarea name="air_${fk}_why">${sv(d,'air_'+fk+'_why')}</textarea></td></tr>`).join('')}</tbody></table></div>`}
function casingPractice(d){const f=[['W','WorkEX'],['S','ServEX'],['C','CommEX']];return `<h3>1. NHẬN DIỆN & ĐO TRẢI NGHIỆM WSC</h3><div class="table-wrap"><table class="matrix"><thead><tr><th>WSC</th><th>Điểm 1–10</th><th>Điều tạo năng lượng</th><th>Điều gây stress / ma sát</th><th>Lãnh đạo cần làm gì?</th></tr></thead><tbody>${f.map(([k,n])=>`<tr><th>${n}</th><td><input type="number" min="1" max="10" name="wsc_${k}" value="${sv(d,'wsc_'+k)}"></td><td><textarea name="wsc_${k}_energy">${sv(d,'wsc_'+k+'_energy')}</textarea></td><td><textarea name="wsc_${k}_stress">${sv(d,'wsc_'+k+'_stress')}</textarea></td><td><textarea name="wsc_${k}_action">${sv(d,'wsc_'+k+'_action')}</textarea></td></tr>`).join('')}</tbody></table></div>`}
function treadPractice(d){const ms=CONTENT.tread.sixM.map(x=>x.key);return `<h3>1. ĐÁNH GIÁ MOTIVATION – 6M</h3><div class="table-wrap"><table class="matrix"><thead><tr><th>6M</th><th>Điểm 1–10</th><th>Căn cứ</th><th>Lãnh đạo cần làm gì để gia tăng?</th></tr></thead><tbody>${ms.map(m=>`<tr><th>${m}</th><td><input type="number" min="1" max="10" name="m_${m}" value="${sv(d,'m_'+m)}"></td><td><textarea name="m_${m}_why">${sv(d,'m_'+m+'_why')}</textarea></td><td><textarea name="m_${m}_action">${sv(d,'m_'+m+'_action')}</textarea></td></tr>`).join('')}</tbody></table></div><div class="spacer"></div><h3>2. ADVANTAGE – PRIDE – YIELD</h3><div class="table-wrap"><table class="matrix"><thead><tr><th>MAPY</th><th>Điểm 1–10</th><th>Căn cứ</th><th>Hành động gia tăng</th></tr></thead><tbody>${[['A','Advantage – Lợi thế so sánh'],['P','Pride – Tự hào'],['Y','Yield – Kết quả']].map(([k,n])=>`<tr><th>${n}</th><td><input type="number" min="1" max="10" name="mapy_${k}" value="${sv(d,'mapy_'+k)}"></td><td><textarea name="mapy_${k}_why">${sv(d,'mapy_'+k+'_why')}</textarea></td><td><textarea name="mapy_${k}_action">${sv(d,'mapy_'+k+'_action')}</textarea></td></tr>`).join('')}</tbody></table></div>`}
function bindPractise(){bindGroupPanel();root.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{ui.activeGroup=Number(b.dataset.group);ui.groupTouched=true;renderRoute()});const g=groupById(ui.activeGroup),form=qs('practiceForm');const edit=canEditGroup(g)&&!g.v1.locked;setEditable(form,edit,!canEditGroup(g)?'Bạn đang xem bài của nhóm khác (chỉ xem).':g.v1.locked?'V1 đã chốt để giữ nguyên bản pitching. Giảng viên có thể mở khóa trong Dashboard.':'');['saveV1','lockV1'].forEach(id=>{if(qs(id))qs(id).hidden=!edit;});const persist=(lock=false)=>{if(!edit)return;const d=formObject(form);if(g.component==='rim'){const cur=num(d.C_cur)+num(d.O_cur)+num(d.D_cur),tgt=num(d.C_tgt)+num(d.O_tgt)+num(d.D_tgt);if(cur!==100||tgt!==100)return alert(`COD phải có tổng bằng 100%. Hiện tại=${cur}%, Mong muốn=${tgt}%.`)}if(lock&&!confirm('Chốt V1? Sau khi chốt, nhóm không sửa V1 được nữa.'))return;put('group',String(g.id),Object.assign({},g.doc,{v1:{locked:lock,data:d},v2:g.v2}),lock?'Đã chốt V1 của nhóm.':'Đã lưu bài nhóm.');};qs('saveV1').onclick=()=>persist(false);qs('lockV1').onclick=()=>persist(true);qs('pitchNow').onclick=()=>{ui.pitchGroup=g.id;navTo('pitch')};qs('exportPptx').onclick=()=>exportPptx(g.id);if(g.component==='rim'){const check=()=>{const fd={};form.querySelectorAll('input[type=number]').forEach(x=>fd[x.name]=x.value);const c=num(fd.C_cur)+num(fd.O_cur)+num(fd.D_cur),t=num(fd.C_tgt)+num(fd.O_tgt)+num(fd.D_tgt);qs('codPracticeCheck').innerHTML=`HIỆN TẠI = <strong>${c}%</strong> • MONG MUỐN = <strong>${t}%</strong> ${c===100&&t===100?'✓':'• Cả hai phải bằng 100%'}`};form.querySelectorAll('input[type=number]').forEach(x=>x.addEventListener('input',check));check();}}

function lens(){return shell('GÓC NHÌN BỔ SUNG','LENS',`${!STAFF&&!myGroupId?'<div class="notice">Chọn nhóm của mình ở PRACTISE trước khi góp góc nhìn.</div>':''}<div class="quote">Đại diện các nhóm bổ sung góc nhìn dựa trên mô thức và kinh nghiệm. LENS không sửa bài V1 của nhóm trình bày.</div><div class="student-only card"><div class="form-grid"><div class="field"><label>Nhóm đóng góp</label><select id="lensSource" ${STAFF?'':'disabled'}>${state.groups.map(g=>`<option value="${g.id}" ${g.id===myGroupId?'selected':''}>${g.name} – ${g.label}</option>`).join('')}</select></div><div class="field"><label>Nhóm nhận góc nhìn</label><select id="lensTarget">${state.groups.map(g=>`<option value="${g.id}">${g.name} – ${g.label}</option>`).join('')}</select></div><div class="field full"><label>Góc nhìn bổ sung</label><textarea id="lensText"></textarea></div><div class="field full"><label>Căn cứ từ mô thức / trải nghiệm</label><textarea id="lensBasis"></textarea></div></div><button class="btn" id="saveLens">GỬI GÓC NHÌN BỔ SUNG</button></div><div class="spacer"></div>${state.groups.map(g=>`<div class="card"><h3>${g.name} – ${g.label}</h3>${state.lenses.filter(x=>x.target===g.id).map(x=>`<div class="lens-card"><strong>${groupById(x.source)?.name||'Nhóm khác'}</strong><p>${nl(x.text)}</p><div class="mini">Căn cứ: ${nl(x.basis)}</div>${STAFF||x.userId===ME.id?`<button type="button" class="btn ghost small" data-del-lens="${h(x.id)}">Xóa</button>`:''}</div>`).join('')||'<div class="empty">Chưa có góc nhìn bổ sung.</div>'}</div><div class="spacer"></div>`).join('')}`,'Sau LENS, từng nhóm quay lại IMPROVE để chốt phương án V2.');}
function bindLens(){qs('saveLens')&&(qs('saveLens').onclick=()=>{const source=STAFF?Number(val('lensSource')):myGroupId,target=Number(val('lensTarget')),text=val('lensText'),basis=val('lensBasis');if(!source)return alert('Chọn nhóm của mình ở PRACTISE trước khi góp góc nhìn.');if(source===target)return alert('Nên chọn nhóm khác để bổ sung góc nhìn.');if(!text)return alert('Vui lòng nhập góc nhìn bổ sung.');const id=('l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toLowerCase();put('lens',id,{source,target,text,basis,at:new Date().toISOString()},'Đã gửi góc nhìn.');});root.querySelectorAll('[data-del-lens]').forEach(b=>b.onclick=()=>{if(confirm('Xóa góc nhìn này?'))del('lens',b.dataset.delLens);});}

function improve(){const g=groupById(ui.activeGroup),v=g.v2,lenses=state.lenses.filter(x=>x.target===g.id);return shell('CẢI TIẾN & CHỐT PHƯƠNG ÁN V2','IMPROVE',`<div class="practice-nav">${state.groups.map(x=>`<button class="${x.id===ui.activeGroup?'active':''}" data-group="${x.id}">${x.name}<br><small>${x.label}</small></button>`).join('')}</div><div class="compare"><div class="card v1"><h3>V1 – PRACTISE</h3>${groupSummaryHtml(g)}</div><div class="card v2"><h3>GÓC NHÌN LENS</h3>${lenses.map(x=>`<div class="lens-card"><strong>${groupById(x.source)?.name}</strong><p>${nl(x.text)}</p><div class="mini">${nl(x.basis)}</div></div>`).join('')||'<div class="empty">Chưa có Lens.</div>'}</div></div><div class="spacer"></div>${pendingBar()}<form id="improveForm" class="card"><div class="section-head"><div><h3>PHIẾU CHỐT CẢI TIẾN</h3><p>Soi lại V1 bằng Paradigm + LENS, rồi chốt V2.</p></div><span class="${v.locked?'status locked':'status'}">${v.locked?'ĐÃ CHỐT V2':'ĐANG CẢI TIẾN'}</span></div><div class="form-grid"><div class="field full"><label>Những góc nhìn nhóm quyết định tiếp thu</label><textarea name="lensUsed">${sv(v,'lensUsed')}</textarea></div><div class="field full"><label>Điều gì thay đổi so với V1?</label><textarea name="changes">${sv(v,'changes')}</textarea></div><div class="field full"><label>Căn cứ từ Mâm – Hơi – Vỏ – Gai</label><textarea name="basis">${sv(v,'basis')}</textarea></div><div class="field full"><label>Phương án / kế hoạch gia tăng cuối cùng</label><textarea name="finalPlan">${sv(v,'finalPlan')}</textarea></div><div class="field full"><label>Kết quả muốn thấy sau 90 ngày</label><textarea name="target90">${sv(v,'target90')}</textarea></div></div><div class="actions"><button type="button" class="btn" id="saveV2" ${v.locked?'disabled':''}>Lưu cải tiến</button><button type="button" class="btn gold" id="lockV2" ${v.locked?'disabled':''}>CHỐT V2</button></div></form>`);}
function bindImprove(){root.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{ui.activeGroup=Number(b.dataset.group);ui.groupTouched=true;renderRoute()});const g=groupById(ui.activeGroup),f=qs('improveForm');const edit=canEditGroup(g)&&!g.v2.locked;setEditable(f,edit,!canEditGroup(g)?'Bạn đang xem bài của nhóm khác (chỉ xem).':'');['saveV2','lockV2'].forEach(id=>{if(qs(id))qs(id).hidden=!edit;});const persist=(lock=false)=>{if(!edit)return;if(lock&&!confirm('Chốt V2? Sau khi chốt, nhóm không sửa V2 được nữa.'))return;const v2=Object.assign({},g.v2,formObject(f),{locked:lock});put('group',String(g.id),Object.assign({},g.doc,{v1:g.v1,v2}),lock?'Đã chốt V2.':'Đã lưu cải tiến.');};qs('saveV2').onclick=()=>persist(false);qs('lockV2').onclick=()=>persist(true);}

function groupSummaryHtml(g){const d=g.v1.data||{};if(!Object.keys(d).length)return'<div class="empty">Nhóm chưa có dữ liệu V1.</div>';if(g.component==='rim')return `<p><strong>Mẫu số:</strong> ${h(d.basis)}</p><div class="cod-stack"><span class="cod-core" style="width:${num(d.C_cur)}%">C ${h(d.C_cur||0)}%</span><span class="cod-open" style="width:${num(d.O_cur)}%">O ${h(d.O_cur||0)}%</span><span class="cod-digital" style="width:${num(d.D_cur)}%">D ${h(d.D_cur||0)}%</span></div><p class="mini">HIỆN TẠI</p><div class="cod-stack"><span class="cod-core" style="width:${num(d.C_tgt)}%">C ${h(d.C_tgt||0)}%</span><span class="cod-open" style="width:${num(d.O_tgt)}%">O ${h(d.O_tgt||0)}%</span><span class="cod-digital" style="width:${num(d.D_tgt)}%">D ${h(d.D_tgt||0)}%</span></div><p class="mini">MONG MUỐN</p>${commonSummary(d)}`;if(g.component==='air'){const s=airScores(d);return `<table class="compact-table"><thead><tr><th>CRISS</th><th>TB</th></tr></thead><tbody>${Object.entries(s.factor).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table><p><strong>Điểm yếu nhất:</strong> ${h(s.lowest.label)} ${s.lowest.score}/10</p>${commonSummary(d)}`;}if(g.component==='casing'){return `<p><strong>WorkEX:</strong> ${h(d.wsc_W||'-')}/10 • <strong>ServEX:</strong> ${h(d.wsc_S||'-')}/10 • <strong>CommEX:</strong> ${h(d.wsc_C||'-')}/10</p>${commonSummary(d)}`;}const r=treadScores(d);return `<p><strong>6M cao nhất:</strong> <span class="rank-high">${h(r.high.label)} ${r.high.score}/10</span></p><p><strong>6M mòn nhất:</strong> <span class="rank-low">${h(r.low.label)} ${r.low.score}/10</span></p><p><strong>Advantage:</strong> ${h(d.mapy_A||'-')} • <strong>Pride:</strong> ${h(d.mapy_P||'-')} • <strong>Yield:</strong> ${h(d.mapy_Y||'-')}</p>${commonSummary(d)}`}
function commonSummary(d){return `<p><strong>Điểm mạnh:</strong> ${nl(d.strengths)}</p><p><strong>Khoảng trống:</strong> ${nl(d.gaps)}</p><p><strong>Kế hoạch gia tăng:</strong> ${nl(d.plan)}</p>`}
function airScores(d){const names={C:'Competence',R:'Relational',I:'Integrity',S1:'System',S2:'Strategic Trust'},f={};Object.keys(names).forEach(k=>f[names[k]]=avg(['L','C','N'].map(t=>d[`air_${k}_${t}`])));const entries=Object.entries(f).map(([label,score])=>({label,score})).sort((a,b)=>a.score-b.score);return{factor:f,lowest:entries[0]||{label:'-',score:0},highest:entries[entries.length-1]||{label:'-',score:0}}}
function treadScores(d){const arr=CONTENT.tread.sixM.map(x=>({label:x.key,score:num(d['m_'+x.key])})).filter(x=>x.score>0).sort((a,b)=>a.score-b.score);return{low:arr[0]||{label:'-',score:0},high:arr[arr.length-1]||{label:'-',score:0}}}

function pitch(){const g=groupById(ui.pitchGroup);return shell(`PITCHING – ${g.name}`,'PRACTISE • TRÌNH BÀY NHANH',`<div class="actions no-print"><button class="btn ghost" id="backPractice">← Quay lại Practise</button><button class="btn secondary" id="pitchPrint">In / Lưu PDF</button><button class="btn gold" id="pitchPptx">Xuất PPTX</button></div><div class="pitch-deck">${pitchSlidesHtml(g)}</div>`,'Không chèn phản biện/LENS vào Pitching.');}
function pitchSlidesHtml(g){const d=g.v1.data||{},memberList=String(d.members||g.members||'').split(/[\n,;]/).filter(Boolean);const title=`${g.name} – ${g.label}`;let slide2='',slide3='',slide4='';if(g.component==='rim'){slide2=`<h3>NHẬN DIỆN HIỆN TRẠNG</h3><p><strong>Mẫu số:</strong> ${h(d.basis||'')}</p><div class="cod-stack"><span class="cod-core" style="width:${num(d.C_cur)}%">Core ${h(d.C_cur||0)}%</span><span class="cod-open" style="width:${num(d.O_cur)}%">Open ${h(d.O_cur||0)}%</span><span class="cod-digital" style="width:${num(d.D_cur)}%">Digital ${h(d.D_cur||0)}%</span></div><p>${nl(d.C_why)} ${nl(d.O_why)} ${nl(d.D_why)}</p>`;slide3=`<h3>CƠ CẤU MONG MUỐN</h3><div class="cod-stack"><span class="cod-core" style="width:${num(d.C_tgt)}%">Core ${h(d.C_tgt||0)}%</span><span class="cod-open" style="width:${num(d.O_tgt)}%">Open ${h(d.O_tgt||0)}%</span><span class="cod-digital" style="width:${num(d.D_tgt)}%">Digital ${h(d.D_tgt||0)}%</span></div>`;}else if(g.component==='air'){const s=airScores(d);slide2=`<h3>CRISS – NIỀM TIN HIỆN TẠI</h3><table class="compact-table">${Object.entries(s.factor).map(([k,v])=>`<tr><td>${k}</td><td><strong>${v}/10</strong></td></tr>`).join('')}</table>`;slide3=`<h3>ĐIỂM MẤT HƠI ƯU TIÊN</h3><div class="pitch-kpi">${s.lowest.label} • ${s.lowest.score}/10</div><p>${nl(d.gaps)}</p>`;}else if(g.component==='casing'){slide2=`<h3>WSC – ĐIỂM TRẢI NGHIỆM</h3><p class="pitch-kpi">W ${h(d.wsc_W||'-')} • S ${h(d.wsc_S||'-')} • C ${h(d.wsc_C||'-')}</p>`;slide3=`<h3>NĂNG LƯỢNG & MA SÁT</h3><p><strong>WorkEX:</strong> ${nl(d.wsc_W_energy)} / ${nl(d.wsc_W_stress)}</p><p><strong>ServEX:</strong> ${nl(d.wsc_S_energy)} / ${nl(d.wsc_S_stress)}</p><p><strong>CommEX:</strong> ${nl(d.wsc_C_energy)} / ${nl(d.wsc_C_stress)}</p>`;}else{const r=treadScores(d);slide2=`<h3>6M – BẢN ĐỒ ĐỘNG LỰC</h3><table class="compact-table">${CONTENT.tread.sixM.map(m=>`<tr><td>${m.key}</td><td><strong>${h(d['m_'+m.key]||'-')}/10</strong></td></tr>`).join('')}</table>`;slide3=`<h3>ĐỘ BÁM</h3><p><strong>M cao nhất:</strong> ${r.high.label} ${r.high.score}/10</p><p><strong>M mòn nhất:</strong> ${r.low.label} ${r.low.score}/10</p><p><strong>Advantage:</strong> ${h(d.mapy_A||'-')} • <strong>Pride:</strong> ${h(d.mapy_P||'-')} • <strong>Yield:</strong> ${h(d.mapy_Y||'-')}</p>`;}slide4=`<h3>ĐÁNH GIÁ</h3><p><strong>Điểm mạnh:</strong> ${nl(d.strengths)}</p><p><strong>Khoảng trống:</strong> ${nl(d.gaps)}</p><p><strong>Tác động nếu không cải thiện:</strong> ${nl(d.impact)}</p>`;return `<div class="pitch-slide"><div class="kicker">BUỔI 02 • BÁNH XE NHÂN LỰC</div><h2>${title}</h2><p><strong>Người pitching:</strong> ${h(d.presenter||g.presenter||'')}</p><p><strong>Thành viên:</strong> ${h(memberList.join(' • '))}</p></div><div class="pitch-slide">${slide2}</div><div class="pitch-slide">${slide3}</div><div class="pitch-slide">${slide4}</div><div class="pitch-slide"><h3>KẾ HOẠCH GIA TĂNG</h3><p>${nl(d.plan)}</p><p><strong>Người chịu trách nhiệm:</strong> ${h(d.owner)}</p><p><strong>Thời hạn:</strong> ${h(d.deadline)}</p><p><strong>Chỉ báo:</strong> ${nl(d.indicator)}</p></div>`}
function bindPitch(){qs('backPractice').onclick=()=>navTo('practise');qs('pitchPrint').onclick=()=>window.print();qs('pitchPptx').onclick=()=>exportPptx(ui.pitchGroup);}

async function exportPptx(groupId){const g=groupById(groupId),d=g.v1.data||{};await loadPptx();if(!window.PptxGenJS)return alert('Không tải được thư viện xuất PPTX.');const pptx=new PptxGenJS();pptx.layout='LAYOUT_WIDE';pptx.author='VABIX';pptx.subject='Buổi 02 – Bánh xe Nhân lực';pptx.title=`${g.name} – ${g.label}`;pptx.company='VABIX';const C={navy:'1A3D2C',green:'1F6B45',gold:'D89830',cream:'F6F3EA',ink:'143420',white:'FFFFFF',muted:'5E6B62'};const addBase=(title,kicker='BUỔI 02 • PRACTISE')=>{const s=pptx.addSlide();s.background={color:'FFFDF8'};s.addText(kicker,{x:.5,y:.3,w:6.5,h:.25,fontSize:10,bold:true,color:C.gold,charSpacing:1.5});s.addText(title,{x:.5,y:.65,w:12.3,h:.55,fontSize:26,bold:true,color:C.navy});s.addShape(pptx.ShapeType.line,{x:.5,y:1.3,w:12.25,h:0,line:{color:'D9E3DF',width:1}});s.addText('LÃNH ĐẠO TỈNH THỨC & KIẾN TẠO',{x:.5,y:7.12,w:12.1,h:.2,fontSize:8,bold:true,color:'F8C050',fill:{color:C.navy},margin:.08});return s};let s=addBase(`${g.name} – ${g.label}`);s.addText(`Người pitching: ${d.presenter||g.presenter||''}`,{x:.7,y:1.8,w:11.6,h:.35,fontSize:18,color:C.ink});s.addText(`Thành viên: ${(d.members||g.members||'').replace(/\n/g,' • ')}`,{x:.7,y:2.35,w:11.6,h:1.4,fontSize:16,color:C.muted,breakLine:false,fit:'shrink'});
const textSlide=(title,lines)=>{const sl=addBase(title);let y=1.65;lines.forEach(x=>{sl.addText(x,{x:.75,y,w:11.5,h:.55,fontSize:18,color:C.ink,breakLine:false,fit:'shrink',bullet:x.startsWith('• ')?{type:'bullet'}:undefined});y+=.7});return sl};
if(g.component==='rim'){textSlide('NHẬN DIỆN HIỆN TRẠNG',[`Core ${d.C_cur||0}% • Open ${d.O_cur||0}% • Digital ${d.D_cur||0}%`,`Mẫu số: ${d.basis||''}`,`Căn cứ Core: ${d.C_why||''}`,`Căn cứ Open: ${d.O_why||''}`,`Căn cứ Digital: ${d.D_why||''}`]);textSlide('CƠ CẤU MONG MUỐN',[`Core ${d.C_tgt||0}% • Open ${d.O_tgt||0}% • Digital ${d.D_tgt||0}%`,`Điểm mạnh: ${d.strengths||''}`,`Khoảng trống: ${d.gaps||''}`]);}else if(g.component==='air'){const sc=airScores(d);textSlide('CRISS – NIỀM TIN HIỆN TẠI',Object.entries(sc.factor).map(([k,v])=>`${k}: ${v}/10`));textSlide('ĐIỂM MẤT HƠI ƯU TIÊN',[`${sc.lowest.label}: ${sc.lowest.score}/10`,`Khoảng trống: ${d.gaps||''}`,`Tác động: ${d.impact||''}`]);}else if(g.component==='casing'){textSlide('WSC – ĐIỂM TRẢI NGHIỆM',[`WorkEX: ${d.wsc_W||'-'}/10`,`ServEX: ${d.wsc_S||'-'}/10`,`CommEX: ${d.wsc_C||'-'}/10`]);textSlide('NĂNG LƯỢNG & MA SÁT',[`WorkEX: ${d.wsc_W_energy||''} | ${d.wsc_W_stress||''}`,`ServEX: ${d.wsc_S_energy||''} | ${d.wsc_S_stress||''}`,`CommEX: ${d.wsc_C_energy||''} | ${d.wsc_C_stress||''}`]);}else{const r=treadScores(d);textSlide('6M – BẢN ĐỒ ĐỘNG LỰC',CONTENT.tread.sixM.map(m=>`${m.key}: ${d['m_'+m.key]||'-'}/10`));textSlide('ĐỘ BÁM MAPY',[`M cao nhất: ${r.high.label} ${r.high.score}/10`,`M mòn nhất: ${r.low.label} ${r.low.score}/10`,`Advantage: ${d.mapy_A||'-'}/10 • Pride: ${d.mapy_P||'-'}/10 • Yield: ${d.mapy_Y||'-'}/10`]);}
textSlide('KẾ HOẠCH GIA TĂNG',[`Điểm mạnh: ${d.strengths||''}`,`Khoảng trống: ${d.gaps||''}`,`Kế hoạch: ${d.plan||''}`,`Người chịu trách nhiệm: ${d.owner||''}`,`Thời hạn: ${d.deadline||''}`,`Chỉ báo: ${d.indicator||''}`]);await pptx.writeFile({fileName:`BUOI02_${g.name.replace(/\s+/g,'_')}_${g.component.toUpperCase()}.pptx`});}

function extract(){return shell('ĐÚC KẾT BÀI HỌC CÁ NHÂN','EXTRACT',`<div class="student-only card"><div class="field"><label>Học viên</label>${studentSelector('e_student')}</div><div class="form-grid"><div class="field full"><label>Bài học lớn nhất về Bánh xe Nhân lực</label><textarea id="e_wheel"></textarea></div><div class="field"><label>Bài học từ MÂM – COD</label><textarea id="e_rim"></textarea></div><div class="field"><label>Bài học từ HƠI – CRISS</label><textarea id="e_air"></textarea></div><div class="field"><label>Bài học từ VỎ – WSC</label><textarea id="e_casing"></textarea></div><div class="field"><label>Bài học từ GAI – MAPY</label><textarea id="e_tread"></textarea></div><div class="field full"><label>Bài học tích hợp sau Practise – Lens – Improve</label><textarea id="e_integrated"></textarea></div><div class="field"><label>Trước đây, tôi thường nghĩ rằng…</label><textarea id="e_before"></textarea></div><div class="field"><label>Sau buổi học, tôi nhận ra rằng…</label><textarea id="e_after"></textarea></div><div class="field full"><label>Một câu tôi muốn ghi nhớ</label><textarea id="e_sentence" maxlength="250"></textarea></div></div><button class="btn gold" id="saveExtract">HOÀN THÀNH EXTRACT</button></div><div class="teacher-only">${extractSummary()}</div>`);}
function studentSelector(id){return `<input id="${id}" value="${h(ME.name)}" disabled><p class="mini">Chỉ bạn và giảng viên xem được nội dung này.</p>`}
function extractSummary(){return `<div class="card"><div class="section-head"><div><h3>BẢNG TỔNG HỢP EXTRACT</h3><p>${state.extracts.length} bài học cá nhân.</p></div></div><div class="actions"><button class="btn ghost" id="anonExtract">${ui.teacherAnonymize?'Hiện tên':'Ẩn danh'}</button><button class="btn" id="exportExtractCsv">Xuất CSV</button><button class="btn secondary" id="printExtract">In / Lưu PDF</button></div><div class="spacer"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Học viên</th><th>Bánh xe</th><th>Mâm</th><th>Hơi</th><th>Vỏ</th><th>Gai</th><th>Tích hợp</th><th>Câu ghi nhớ</th></tr></thead><tbody>${state.extracts.map((x,i)=>`<tr><td>${ui.teacherAnonymize?'Học viên '+String(i+1).padStart(2,'0'):h(x.student)}</td><td>${nl(x.wheel)}</td><td>${nl(x.rim)}</td><td>${nl(x.air)}</td><td>${nl(x.casing)}</td><td>${nl(x.tread)}</td><td>${nl(x.integrated)}</td><td>${nl(x.sentence)}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có dữ liệu.</td></tr>'}</tbody></table></div></div>`}
function bindExtract(){const mine=state.extracts.find(x=>x.userId===ME.id);if(mine)['wheel','rim','air','casing','tread','integrated','before','after','sentence'].forEach(k=>{if(qs('e_'+k))qs('e_'+k).value=mine[k]||'';});qs('saveExtract')&&(qs('saveExtract').onclick=()=>{const rec={wheel:val('e_wheel'),rim:val('e_rim'),air:val('e_air'),casing:val('e_casing'),tread:val('e_tread'),integrated:val('e_integrated'),before:val('e_before'),after:val('e_after'),sentence:val('e_sentence'),at:new Date().toISOString()};put('extract',String(ME.id),rec,'Đã lưu Extract cá nhân.');});qs('anonExtract')&&(qs('anonExtract').onclick=()=>{ui.teacherAnonymize=!ui.teacherAnonymize;renderRoute()});qs('exportExtractCsv')&&(qs('exportExtractCsv').onclick=exportExtractCSV);qs('printExtract')&&(qs('printExtract').onclick=()=>window.print());}

const FOCUS_OPTIONS=[['rim','MÂM – COD'],['air','HƠI – CRISS'],['casing','VỎ – WSC'],['tread','GAI – MAPY'],['core','Core'],['open','Open'],['digital','Digital'],['competence','Competence'],['relational','Relational'],['integrity','Integrity'],['system','System'],['strategic-trust','Strategic Trust'],['workex','WorkEX'],['servex','ServEX'],['commex','CommEX'],['money','Money'],['meaning','Meaning'],['mastery','Mastery'],['member','Member'],['merit','Merit'],['might','Might'],['advantage','Advantage'],['pride','Pride'],['yield','Yield']];
function resolve(){return shell('CAM KẾT HÀNH ĐỘNG 90 NGÀY','RESOLVE',`<div class="student-only card"><div class="field"><label>Học viên</label>${studentSelector('r_student')}</div><div class="form-grid"><div class="field"><label>Trọng tâm Bánh xe Nhân lực</label><select id="r_focus"><option value="">-- Chọn --</option>${FOCUS_OPTIONS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div class="field full"><label>Trong 90 ngày tới, tôi sẽ…</label><textarea id="r_action"></textarea></div><div class="field"><label>30 ngày – Tôi bắt đầu làm gì?</label><textarea id="r_30"></textarea></div><div class="field"><label>60 ngày – Tôi cần tạo ra thay đổi nào?</label><textarea id="r_60"></textarea></div><div class="field"><label>90 ngày – Tôi muốn chứng minh kết quả gì?</label><textarea id="r_90"></textarea></div><div class="field"><label>Bằng chứng hoàn thành</label><textarea id="r_evidence"></textarea></div><div class="field"><label>Người/nguồn lực hỗ trợ</label><textarea id="r_support"></textarea></div><div class="field"><label>Rủi ro cản trở & cách xử lý</label><textarea id="r_barrier"></textarea></div></div><button class="btn gold" id="saveResolve">CHỐT CAM KẾT 90 NGÀY</button></div><div class="teacher-only">${resolveSummary()}</div>`);}
function resolveSummary(){return `<div class="card"><div class="section-head"><div><h3>BẢNG CAM KẾT 90 NGÀY</h3><p>${state.resolves.length} cam kết đã chốt.</p></div></div><div class="actions"><button class="btn ghost" id="anonResolve">${ui.teacherAnonymize?'Hiện tên':'Ẩn danh'}</button><button class="btn" id="exportResolveCsv">Xuất CSV</button><button class="btn secondary" id="printResolve">In / Lưu PDF</button></div><div class="spacer"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Học viên</th><th>Trọng tâm</th><th>Hành động 90 ngày</th><th>30 ngày</th><th>60 ngày</th><th>90 ngày</th><th>Bằng chứng</th></tr></thead><tbody>${state.resolves.map((x,i)=>`<tr><td>${ui.teacherAnonymize?'Học viên '+String(i+1).padStart(2,'0'):h(x.student)}</td><td>${h(focusName(x.focus))}</td><td>${nl(x.action)}</td><td>${nl(x.d30)}</td><td>${nl(x.d60)}</td><td>${nl(x.d90)}</td><td>${nl(x.evidence)}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có dữ liệu.</td></tr>'}</tbody></table></div></div>`}
function focusName(k){return FOCUS_OPTIONS.find(x=>x[0]===k)?.[1]||k}
function bindResolve(){const mine=state.resolves.find(x=>x.userId===ME.id);if(mine){if(qs('r_focus'))qs('r_focus').value=mine.focus||'';[['action','r_action'],['d30','r_30'],['d60','r_60'],['d90','r_90'],['evidence','r_evidence'],['support','r_support'],['barrier','r_barrier']].forEach(([k,id])=>{if(qs(id))qs(id).value=mine[k]||'';});}qs('saveResolve')&&(qs('saveResolve').onclick=()=>{const rec={focus:val('r_focus'),action:val('r_action'),d30:val('r_30'),d60:val('r_60'),d90:val('r_90'),evidence:val('r_evidence'),support:val('r_support'),barrier:val('r_barrier'),at:new Date().toISOString()};put('resolve',String(ME.id),rec,'Đã chốt cam kết 90 ngày.');});qs('anonResolve')&&(qs('anonResolve').onclick=()=>{ui.teacherAnonymize=!ui.teacherAnonymize;renderRoute()});qs('exportResolveCsv')&&(qs('exportResolveCsv').onclick=exportResolveCSV);qs('printResolve')&&(qs('printResolve').onclick=()=>window.print());}

function dashboard(){const students=allStudents(),v1=state.groups.filter(g=>g.v1.locked).length,v2=state.groups.filter(g=>g.v2.locked).length;return shell('DASHBOARD GIẢNG VIÊN','QUẢN TRỊ LỚP',`<div class="grid four"><div class="metric"><span>Học viên đã xếp nhóm</span><strong>${students.length?board.roster.filter(p=>memberOf.get(p.id)).length+'/'+students.length:'0'}</strong></div><div class="metric"><span>Nhóm chốt V1</span><strong>${v1}/4</strong></div><div class="metric"><span>Nhóm chốt V2</span><strong>${v2}/4</strong></div><div class="metric"><span>Extract / Resolve</span><strong>${state.extracts.length} / ${state.resolves.length}</strong></div></div><div class="spacer"></div><div class="card"><h3>Tiến độ</h3><p>V1 nhóm</p><div class="progress"><div style="width:${v1/4*100}%"></div></div><p>V2 nhóm</p><div class="progress"><div style="width:${v2/4*100}%"></div></div><p>Extract cá nhân</p><div class="progress"><div style="width:${students.length?state.extracts.length/students.length*100:0}%"></div></div><p>Resolve cá nhân</p><div class="progress"><div style="width:${students.length?state.resolves.length/students.length*100:0}%"></div></div></div><div class="spacer"></div><div class="grid two"><div class="card"><h3>Xuất dữ liệu</h3><div class="actions"><button class="btn" id="exportAll">Xuất toàn bộ JSON</button><button class="btn secondary" id="exportExtractDash">Extract CSV</button><button class="btn secondary" id="exportResolveDash">Resolve CSV</button></div></div><div class="card"><h3>Lưu trữ</h3><p class="mini">Dữ liệu lớp lưu trên hệ thống VABIX, đồng bộ giữa giảng viên và học viên. Xuất JSON để giữ một bản sao lưu.</p></div></div><div class="spacer"></div>${groupPanel()}<div class="card"><h3>Mở khóa bản nhóm</h3><div class="grid four">${state.groups.map(g=>`<div class="metric"><strong style="font-size:18px">${g.name}</strong><div>${g.label}</div><div class="actions"><button class="btn ghost" data-unlock-v1="${g.id}">Mở V1</button><button class="btn ghost" data-unlock-v2="${g.id}">Mở V2</button></div></div>`).join('')}</div></div>`);}
function bindDashboard(){bindGroupPanel();qs('exportAll').onclick=()=>downloadBlob('buoi02-class-data.json',JSON.stringify({exportedAt:new Date().toISOString(),roster:board.roster,activateVotes:state.activateVotes,groups:state.groups.map(g=>({id:g.id,name:g.name,component:g.component,label:g.label,members:g.memberIds.map(personName),v1:g.v1,v2:g.v2})),lenses:state.lenses.map(x=>Object.assign({},x,{author:personName(x.userId)})),extracts:state.extracts,resolves:state.resolves},null,2),'application/json');qs('exportExtractDash').onclick=exportExtractCSV;qs('exportResolveDash').onclick=exportResolveCSV;root.querySelectorAll('[data-unlock-v1]').forEach(b=>b.onclick=()=>{const g=groupById(b.dataset.unlockV1);if(!g.v1.locked)return toast('V1 của nhóm này đang mở.');if(confirm(`Mở khóa V1 của ${g.name}?`))put('group',String(g.id),Object.assign({},g.doc,{v1:Object.assign({},g.v1,{locked:false}),v2:g.v2}),'Đã mở khóa V1.')});root.querySelectorAll('[data-unlock-v2]').forEach(b=>b.onclick=()=>{const g=groupById(b.dataset.unlockV2);if(!g.v2.locked)return toast('V2 của nhóm này đang mở.');if(confirm(`Mở khóa V2 của ${g.name}?`))put('group',String(g.id),Object.assign({},g.doc,{v1:g.v1,v2:Object.assign({},g.v2,{locked:false})}),'Đã mở khóa V2.')});}
function exportExtractCSV(){const rows=[['Học viên','Bài học Bánh xe','Mâm COD','Hơi CRISS','Vỏ WSC','Gai MAPY','Bài học tích hợp','Trước đây','Sau buổi học','Câu ghi nhớ']];state.extracts.forEach((x,i)=>rows.push([ui.teacherAnonymize?'Học viên '+String(i+1).padStart(2,'0'):x.student,x.wheel,x.rim,x.air,x.casing,x.tread,x.integrated,x.before,x.after,x.sentence]));downloadBlob('extract-buoi02.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
function exportResolveCSV(){const rows=[['Học viên','Trọng tâm','Hành động 90 ngày','30 ngày','60 ngày','90 ngày','Bằng chứng','Hỗ trợ','Rủi ro & xử lý']];state.resolves.forEach((x,i)=>rows.push([ui.teacherAnonymize?'Học viên '+String(i+1).padStart(2,'0'):x.student,focusName(x.focus),x.action,x.d30,x.d60,x.d90,x.evidence,x.support,x.barrier]));downloadBlob('resolve-90-ngay-buoi02.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}


root.addEventListener('click',e=>{const r=e.target.closest('[data-route]');if(r){navTo(r.dataset.route);return;}const m=e.target.closest('[data-mode]');if(m){ui.mode=m.dataset.mode;render();return;}if(e.target.closest('[data-present]')){root.querySelector('.qb-app').classList.toggle('present-mode');if(document.fullscreenElement)document.exitFullscreen?.();else root.querySelector('.qb-app').requestFullscreen?.().catch(()=>{});}});
board.summarize(()=>{syncState();const g=myGroupId?groupById(myGroupId):null,ex=state.extracts.find(x=>x.userId===ME.id),rs=state.resolves.find(x=>x.userId===ME.id),lens=state.lenses.some(x=>x.userId===ME.id),own=x=>{if(!x)return null;const o=Object.assign({},x);delete o.userId;delete o.student;return o;},steps=[myVote!==null,!!g,!!(g&&g.v1.locked),lens,!!(g&&g.v2.locked),!!ex,!!rs];return {answers:{group:g?`${g.name} – ${g.label}`:'',vote:myVote===null?'':String(CONTENT.activate.choices[myVote]||''),v1Locked:!!(g&&g.v1.locked),v2Locked:!!(g&&g.v2.locked),lens,extract:own(ex),resolve:rs?Object.assign(own(rs),{focus:focusName(rs.focus)}):null},progress:Math.round(steps.filter(Boolean).length/steps.length*100)};});
board.onChange(onRemote);
render();
</script>
