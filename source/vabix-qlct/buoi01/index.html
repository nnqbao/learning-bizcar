  domains: [
    {id:'nhan', name:'NHÂN', desc:'Miền phẩm chất liên quan đến cách người lãnh đạo nhìn nhận, tôn trọng và phát triển con người.', traits:[
      {name:'Nhân ái', en:'Humanity', nature:'Quan tâm đến con người như một giá trị tự thân, không chỉ như nguồn lực thực hiện công việc.', identify:'Lắng nghe khó khăn thực tế; cân nhắc tác động của quyết định đến người lao động; hỗ trợ nhưng không dung túng sai phạm.', impact:'Tăng gắn kết, an toàn tâm lý và tinh thần hợp tác; giúp đội ngũ dám nói thật và hỗ trợ nhau.', harm:'Dễ hình thành môi trường lạnh lùng, phòng thủ, giấu vấn đề và giảm niềm tin vào người quản lý.', dilemma:'Một nhân viên có năng lực vừa gây ra sai sót nghiêm trọng trong lúc gia đình gặp biến cố. Bạn xử lý trách nhiệm và hỗ trợ ra sao?', practice:'Tách con người khỏi hành vi; phản hồi rõ việc sai nhưng vẫn giữ sự tôn trọng; hỏi trước khi kết luận.'},

      {name:'Thấu cảm', en:'Empathy', nature:'Khả năng nhìn tình huống từ góc nhìn của người khác trước khi đánh giá và hành động.', identify:'Đặt câu hỏi để hiểu nguyên nhân; phân biệt dữ kiện với suy đoán; điều chỉnh cách giao tiếp theo đối tượng.', impact:'Giúp xử lý mâu thuẫn tốt hơn, giao việc phù hợp hơn và tăng chất lượng dẫn dắt.', harm:'Quản lý dễ quy chụp, phản ứng cảm tính và bỏ sót nguyên nhân thật của vấn đề.', dilemma:'Một bộ phận liên tục trễ phản hồi khiến đơn hàng bị ảnh hưởng. Bạn kết luận năng lực kém hay tìm hiểu điều kiện hệ thống?', practice:'Dùng câu hỏi “điều gì đang xảy ra?” trước “ai sai?”; xác minh từ nhiều nguồn.'}
    ]},
    {id:'dao', name:'ĐẠO', desc:'Miền phẩm chất liên quan đến chuẩn mực, nguyên tắc và sự đúng đắn trong hành vi lãnh đạo.', traits:[

function activate(){return shell('CÙNG KHỞI ĐỘNG','ACTIVATE • 05 PHÚT',`<div class="case"><h3>Khi áp lực tiến độ bắt đầu kéo theo những quyết định khó…</h3><p>Một doanh nghiệp sản xuất đang có đơn hàng và doanh thu tốt, nhưng áp lực giao hàng tăng. Một số thông tin chất lượng cần được kiểm tra bổ sung; các bộ phận bắt đầu đổ lỗi; nhân viên ngại báo tin xấu; chi phí khẩn cấp và công nợ có dấu hiệu tăng.</p><div class="quote"><strong>Câu hỏi:</strong> Điểm nghẽn nguy hiểm nhất nằm ở đâu?</div><div class="grid four"><div class="card">Phẩm chất lãnh đạo</div><div class="card">Trí tuệ kinh doanh</div><div class="card">Sự đứt gãy giữa cả hai</div><div class="card">Phối hợp &amp; kiểm soát</div></div><p class="mini">Tình huống giả định dùng để khởi động; không mô tả thực trạng của Công ty Cổ phần Bê tông Ly tâm Thủ Đức 1.</p></div>`,'Lấy phản hồi nhanh, chưa kết luận đúng/sai; tạo nhu cầu khám phá hai mô thức.');}

 const d=CONTENT.domains.find(x=>x.id===ui.p1Domain)||CONTENT.domains[0]; const t=d.traits[ui.p1Trait]||d.traits[0];
 return shell('4 MIỀN PHẨM CHẤT LÃNH ĐẠO','PARADIGM 01',`<div class="draft"><strong>Lưu ý nội dung:</strong> Cấu trúc 4 miền NHÂN – ĐẠO – CHÍ – TẦM đã chốt. Danh mục phẩm chất cụ thể hiện là nội dung mẫu để vận hành bài học; cần khóa danh mục chính thức trước khi phát hành rộng rãi.</div><div class="grid four">${CONTENT.domains.map(x=>`<div class="card domain" data-domain="${x.id}"><div class="domain-name">${x.name}</div><div class="domain-sub">${x.desc}</div><div class="trait-list">${x.traits.map(z=>`<span class="chip">${z.name}</span>`).join('')}</div></div>`).join('')}</div><div class="spacer"></div><div class="lesson-panel"><div class="lesson-title"><div class="kicker">MIỀN ${d.name} • PHẨM CHẤT</div><h3>${t.name}</h3><div class="muted">${t.en}</div><div class="trait-list">${d.traits.map((z,i)=>`<button class="trait-button ${i===ui.p1Trait?'active':''}" data-trait="${i}">${z.name}</button>`).join('')}</div></div><div class="lesson-body">${traitAcc('Bản chất',t.nature)}${traitAcc('Cách nhận diện',t.identify)}${traitAcc('Tác động tích cực',t.impact)}${traitAcc('Tác hại khi thiếu',t.harm,'dangerbox')}${traitAcc('Tình huống thử thách',t.dilemma,'warning')}${traitAcc('Cách rèn luyện',t.practice)}<div class="callout"><strong>Câu hỏi tự soi:</strong> Lần gần nhất phẩm chất này bị thử thách trong công việc, tôi đã hành xử như thế nào? Bằng chứng hành vi là gì?</div></div></div>`,`Bốn miền là bốn nhóm phẩm chất; mỗi miền chứa các phẩm chất cụ thể và được nhận diện bằng hành vi.`);
}
function traitAcc(title,body,cls=''){return `<details class="accordion" open><summary>${title}</summary><div class="callout ${cls}">${body}</div></details>`}
function bindP1(){root.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>{ui.p1Domain=b.dataset.domain;ui.p1Trait=0;renderRoute();});root.querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{ui.p1Trait=+b.dataset.trait;renderRoute();});}

function p2(){const l=CONTENT.acumen.find(x=>x.id===ui.p2Lens)||CONTENT.acumen[0];return shell('TRÍ TUỆ KINH DOANH','PARADIGM 02 • BUSINESS ACUMEN',`<div class="grid five">${CONTENT.acumen.map(x=>`<div class="card domain" data-lens="${x.id}"><div class="kicker">${x.icon}</div><h3>${x.name}</h3><p class="mini">${x.meaning}</p></div>`).join('')}</div><div class="spacer"></div><div class="lesson-panel"><div class="lesson-title"><div class="kicker">BUSINESS ACUMEN • ${l.icon}</div><h3>${l.name}</h3></div><div class="lesson-body">${traitAcc('Ý nghĩa',l.meaning)}${traitAcc('Dữ kiện cần quan sát',l.observe)}${traitAcc('Tác động khi nhìn tốt',l.impact)}${traitAcc('Tổn thất khi bỏ qua',l.neglect,'dangerbox')}<details class="accordion" open><summary>Câu hỏi quản trị</summary><ul>${l.questions.map(q=>`<li>${q}</li>`).join('')}</ul></details>${traitAcc('Ví dụ trong doanh nghiệp sản xuất',l.example,'warning')}</div></div>`,`5 góc nhìn giúp nhà quản lý nhìn thấy tác động của quyết định lên kết quả kinh doanh toàn công ty.`);}
function bindP2(){root.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{ui.p2Lens=b.dataset.lens;renderRoute();});}

/* ---- Class board: data comes from `board` (components/learning/ClassBoardLesson.tsx), not the browser. ---- */
const STAFF = board.staff === true;
const ME = board.me;
let ui = {route:'home', mode: STAFF ? 'teacher' : 'student', p1Domain:'nhan', p1Trait:0, p2Lens:'customer', practiseGroup:0, improveGroup:0, anon:false, dirty:false, pending:false};
try { const saved = window.sessionStorage.getItem('qlct-b01-route'); if (saved) ui.route = saved; } catch (e) {}

const $ = sel => root.querySelector(sel), $$ = sel => [...root.querySelectorAll(sel)];
function h(s=''){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function nl(s=''){return h(s).replace(/\n/g,'<br>');}
function qs(id){return root.querySelector('#'+id);}
function val(id){return (qs(id)?.value||'').trim();}
function blankV1(){return {decision:'',traits:{nhan:'',dao:'',chi:'',tam:''},behaviors:{nhan:'',dao:'',chi:'',tam:''},acumen:{customer:'',quality:'',schedule:'',cost:'',cashflow:''},actions:'',risks:'',conclusion:'',locked:false};}
function blankV2(){return {accepted:'',changes:'',grounds:'',final:'',locked:false};}
function personName(id){const p=board.roster.find(x=>x.id===Number(id));return p?p.name:(Number(id)===ME.id?ME.name:`Học viên #${id}`);}

/** Everything the screens need, rebuilt from the board rows on every render. */
function snap(){
  const rows=board.rows(), by=k=>rows.filter(r=>r.kind===k);
  const setup=(by('setup')[0]||{}).data||{};
  const count=Math.min(8,Math.max(2,Number(setup.count)||4));
  const meta=setup.groups||{};
  const memberOf=new Map(by('member').map(r=>[Number(r.key),Number(r.data.groupId)]));
  const groups=Array.from({length:count},(_,i)=>{const id=i+1,m=meta[id]||{},doc=(by('group').find(r=>r.key===String(id))||{}).data||{};const v1=Object.assign(blankV1(),doc.v1||{}),v2=Object.assign(blankV2(),doc.v2||{});v1.traits=Object.assign(blankV1().traits,v1.traits||{});v1.behaviors=Object.assign(blankV1().behaviors,v1.behaviors||{});v1.acumen=Object.assign(blankV1().acumen,v1.acumen||{});return {id,name:m.name||`NHÓM ${id}`,leaderId:m.leaderId||null,pitcherId:m.pitcherId||null,v1,v2,doc,memberIds:[...memberOf].filter(([,g])=>g===id).map(([u])=>u)};});
  const lens=by('lens').map(r=>Object.assign({id:r.key,userId:r.userId},r.data)).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const extracts=by('extract').map(r=>Object.assign({},r.data,{userId:Number(r.key)}));
  const resolves=by('resolve').map(r=>Object.assign({},r.data,{userId:Number(r.key)}));
  const myGroupId=memberOf.get(ME.id)||null;
  return {setup,count,groups,memberOf,lens,extracts,resolves,myGroupId};
}
function canEditGroup(s,g){return STAFF||s.myGroupId===g.id;}
function groupName(s,id){return (s.groups.find(g=>g.id===+id)||{}).name||`Nhóm ${id}`;}
function teacherView(){return STAFF&&ui.mode==='teacher';}

async function put(kind,key,data,okText){
  const res=await board.put(kind,key,data);
  if(!res.ok){alert(errorText(res.error));return false;}
  ui.dirty=false; if(okText) toast(okText); renderRoute(); return true;
}
async function del(kind,key){const res=await board.del(kind,key);if(!res.ok){alert(errorText(res.error));return false;}renderRoute();return true;}
function errorText(code){return ({NOT_IN_GROUP:'Bạn chưa thuộc nhóm này. Chọn nhóm của mình ở PRACTISE hoặc nhờ giảng viên xếp nhóm.',LOCKED:'Bản này đã chốt. Chỉ giảng viên mở khóa được.',FORBIDDEN:'Bạn không có quyền sửa nội dung này.',EXPIRED:'Phiên làm việc đã hết hạn. Tải lại trang để tiếp tục.',TOO_LARGE:'Nội dung quá dài.',OFFLINE:'Chưa kết nối được máy chủ. Nội dung chưa được lưu, hãy thử lại.'})[code]||'Chưa lưu được. Hãy thử lại.';}
function toast(text){const t=qs('qbToast');if(!t)return;t.textContent=text;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600);}

function navTo(route){ui.route=route;ui.dirty=false;try{window.sessionStorage.setItem('qlct-b01-route',route);}catch(e){}render();try{root.scrollIntoView({block:'start',behavior:'smooth'});}catch(e){}}
function setMode(mode){ui.mode=mode;render();}
function renderToolbar(){
  const live=board.status()==='live';
  qs('qbToolbar').innerHTML=`${STAFF?`<button class="seg ${ui.mode==='student'?'active':''}" data-mode="student">Xem như học viên</button><button class="seg ${ui.mode==='teacher'?'active':''}" data-mode="teacher">Giảng viên</button>`:`<span class="who">${h(ME.name)}${snap().myGroupId?` · ${h(groupName(snap(),snap().myGroupId))}`:''}</span>`}<button class="btn ghost" data-present>Trình chiếu</button><span class="live ${live?'on':''}">${live?'Đang đồng bộ lớp':'Mất kết nối – đang thử lại'}</span>`;
}
function renderSidebar(){
  qs('qbSide').innerHTML=CONTENT.nav.filter(g=>!g.teacher||teacherView()).map(g=>`<div class="nav-group"><div class="nav-label">${g.group}</div>${g.items.map(i=>`<button class="nav-item ${ui.route===i[0]?'active':''}" data-route="${i[0]}">${i[1]}<small>${i[2]}</small></button>`).join('')}</div>`).join('');
}
function render(){root.querySelector('.qb-app').classList.toggle('teacher-mode',teacherView());renderToolbar();renderSidebar();renderRoute();}
function shell(title,kicker,body,desc=''){return `<div class="stage"><div class="section-head"><div><div class="kicker">${kicker}</div><h2>${title}</h2><p>${desc}</p></div></div>${body}</div>`;}
function renderRoute(){
  const routes={home,bonus6ft,bonus6s,mindset,objective,activate,p1,p2,practise,lens,improve,extract,resolve,dashboard};
  if(ui.route==='dashboard'&&!teacherView())ui.route='home';
  qs('qbMain').innerHTML=(routes[ui.route]||home)();
  ui.pending=false; ui.dirty=false;
  const binders={practise:bindPractise,lens:bindLens,improve:bindImprove,extract:bindExtract,resolve:bindResolve,dashboard:bindDashboard,p1:bindP1,p2:bindP2};
  binders[ui.route]?.();
}
/** Remote change: re-render unless the person is typing; then offer to reload. */
function onRemote(){
  renderToolbar();
  if(ui.dirty){ui.pending=true;const n=qs('qbPending');if(n)n.hidden=false;return;}
  if(root.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ui.pending=true;return;}
  renderRoute();
}

/* ---------- PRACTISE ---------- */
function groupTabs(s,attr,current){return `<div class="subnav tabs">${s.groups.map((g,i)=>`<button class="${i===current?'active':''}" ${attr}="${i}">${h(g.name)}${s.myGroupId===g.id?' · nhóm tôi':''}</button>`).join('')}</div>`;}
function myGroupPicker(s){
  if(STAFF)return '';
  if(s.myGroupId)return `<div class="notice">Bạn thuộc <strong>${h(groupName(s,s.myGroupId))}</strong>. Bạn sửa được V1, V2 của nhóm mình; nhóm khác chỉ xem.${''} <button class="btn ghost small" data-change-group>Đổi nhóm</button></div>`;
  return `<div class="card pick-group"><h3>Bạn thuộc nhóm nào?</h3><p class="muted">Chọn đúng nhóm giảng viên đã xếp. Giảng viên có thể điều chỉnh lại.</p><div class="actions">${s.groups.map(g=>`<button class="btn" data-join="${g.id}">${h(g.name)}</button>`).join('')}</div></div>`;
}
function groupSetup(s){
  const learners=board.roster;
  return `<div class="teacher-only"><div class="card"><h3>Thiết lập nhóm</h3><p class="muted">Xếp học viên vào nhóm. Học viên cũng tự chọn được nhóm của mình; lựa chọn của giảng viên ghi đè.</p>
  <div class="form-grid"><div class="field"><label>Số nhóm</label><select id="g_count">${[2,3,4,5,6,7,8].map(n=>`<option ${n===s.count?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <div class="grid two">${s.groups.map(g=>`<div class="card soft"><div class="field"><label>Tên nhóm</label><input id="g_name_${g.id}" value="${h(g.name)}"></div><div class="form-grid"><div class="field"><label>Trưởng nhóm</label><select id="g_leader_${g.id}"><option value="">—</option>${g.memberIds.map(u=>`<option value="${u}" ${g.leaderId===u?'selected':''}>${h(personName(u))}</option>`).join('')}</select></div><div class="field"><label>Người pitching</label><select id="g_pitcher_${g.id}"><option value="">—</option>${g.memberIds.map(u=>`<option value="${u}" ${g.pitcherId===u?'selected':''}>${h(personName(u))}</option>`).join('')}</select></div></div><p class="mini">${g.memberIds.length} thành viên: ${g.memberIds.map(u=>h(personName(u))).join(' • ')||'chưa có'}</p></div>`).join('')}</div>
  <div class="actions"><button class="btn" data-save-setup>Lưu thiết lập nhóm</button></div>
  <div class="spacer"></div><h3>Xếp học viên (${learners.length})</h3>${learners.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Học viên</th><th>Nhóm</th></tr></thead><tbody>${learners.map(p=>`<tr><td>${h(p.name)}</td><td><select data-assign="${p.id}"><option value="">— Chưa xếp —</option>${s.groups.map(g=>`<option value="${g.id}" ${s.memberOf.get(p.id)===g.id?'selected':''}>${h(g.name)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Lớp chưa có học viên. Thêm học viên ở trang quản lý lớp.</div>'}
  </div><div class="spacer"></div></div>`;
}
function practise(){
  const s=snap(); if(ui.practiseGroup>=s.groups.length)ui.practiseGroup=0;
  if(!STAFF&&s.myGroupId&&ui.practiseGroupTouched!==true)ui.practiseGroup=s.groups.findIndex(g=>g.id===s.myGroupId);
  return shell('THỰC HÀNH NHÓM & PITCHING',`PRACTISE • ${String(s.count).padStart(2,'0')} NHÓM`,`${groupSetup(s)}${myGroupPicker(s)}<div class="case"><div class="kicker">TÌNH HUỐNG GIẢ ĐỊNH</div><h3>ĐƠN HÀNG GẤP 500 ỐNG BÊ TÔNG</h3><p>Một khách hàng quan trọng yêu cầu giao 500 ống bê tông trong thời hạn gấp. Kế hoạch sản xuất đang chịu áp lực tiến độ, đồng thời bộ phận kiểm soát chất lượng phát hiện một số sản phẩm cần kiểm tra bổ sung trước khi quyết định xuất hàng.</p><p><strong>Yêu cầu:</strong> Nhóm đề xuất phương án vừa thể hiện phẩm chất lãnh đạo, vừa chứng minh được Trí tuệ kinh doanh. An toàn, chất lượng và điều kiện nghiệm thu là ràng buộc bắt buộc.</p></div><div class="spacer"></div>${groupTabs(s,'data-practise-group',ui.practiseGroup)}<div id="practiseEditor">${practiseGroup(s,s.groups[ui.practiseGroup])}</div>`,'PRACTISE chỉ gồm làm bài và pitching. Góc nhìn bổ sung thuộc LENS; cải tiến thuộc IMPROVE.');
}
function pendingBar(){return `<div class="pending" id="qbPending" hidden>Nhóm vừa cập nhật nội dung mới. <button class="btn ghost small" data-reload>Tải bản mới (bỏ phần đang gõ)</button></div>`;}
function practiseGroup(s,g){
  const v=g.v1, edit=canEditGroup(s,g)&&(!v.locked), dis=edit?'':'disabled';
  const options=(domain,sel)=>`<option value="">-- Chọn phẩm chất --</option>`+CONTENT.domains.find(d=>d.id===domain).traits.map(t=>`<option ${sel===t.name?'selected':''}>${t.name}</option>`).join('');
  return `<div class="card"><div class="section-head"><div><div class="kicker">${h(g.name)}</div><h2 class="h-sm">PHƯƠNG ÁN V1</h2><p>${g.memberIds.length?g.memberIds.map(u=>h(personName(u))+(u===g.leaderId?' (trưởng nhóm)':'')).join(' • '):'Chưa có danh sách thành viên.'}</p></div><div class="status ${v.locked?'locked':''}">${v.locked?'ĐÃ CHỐT V1':'ĐANG SOẠN'}</div></div>${pendingBar()}${v.locked?`<div class="locked-banner">V1 đã khóa để giữ nguyên bản pitching ban đầu. Giảng viên có thể mở khóa trong Dashboard nếu cần.</div>`:''}${!canEditGroup(s,g)?`<div class="notice">Bạn đang xem phương án của nhóm khác (chỉ xem).</div>`:''}<div class="form-grid"><div class="field full"><label>A. Quyết định của nhóm</label><textarea id="p_decision" ${dis}>${h(v.decision)}</textarea></div><div class="field full"><label>B. Bốn miền phẩm chất lãnh đạo</label></div>${['nhan','dao','chi','tam'].map(id=>{const d=CONTENT.domains.find(x=>x.id===id);return `<div class="field"><label>Miền ${d.name} – chọn phẩm chất</label><select id="p_trait_${id}" ${dis}>${options(id,v.traits[id])}</select><label>Hành vi thể hiện</label><textarea id="p_behavior_${id}" ${dis}>${h(v.behaviors[id])}</textarea></div>`}).join('')}<div class="field full"><label>C. Business Acumen – phân tích 5 góc nhìn</label></div>${CONTENT.acumen.map(a=>`<div class="field"><label>${a.name}</label><textarea id="p_ac_${a.id}" ${dis}>${h(v.acumen[a.id])}</textarea></div>`).join('')}<div class="field full"><label>D. Ba hành động then chốt</label><textarea id="p_actions" ${dis}>${h(v.actions)}</textarea></div><div class="field full"><label>Rủi ro &amp; điều kiện kiểm soát</label><textarea id="p_risks" ${dis}>${h(v.risks)}</textarea></div><div class="field full"><label>Thông điệp kết luận pitching</label><textarea id="p_conclusion" ${dis}>${h(v.conclusion)}</textarea></div></div><div class="actions no-print">${edit?`<button class="btn" data-save-v1="${g.id}">Lưu V1</button><button class="btn gold" data-lock-v1="${g.id}">Chốt V1</button>`:''}<button class="btn secondary" data-pitch="${g.id}">PITCH NGAY</button><button class="btn ghost" data-print-pitch="${g.id}">In / Lưu PDF</button><button class="btn ghost" data-export-pitch="${g.id}">Xuất file HTML pitching</button></div><div id="pitchPreview"></div></div>`;
}
function readV1(v){v.decision=val('p_decision');['nhan','dao','chi','tam'].forEach(id=>{v.traits[id]=val(`p_trait_${id}`);v.behaviors[id]=val(`p_behavior_${id}`)});CONTENT.acumen.forEach(a=>v.acumen[a.id]=val(`p_ac_${a.id}`));v.actions=val('p_actions');v.risks=val('p_risks');v.conclusion=val('p_conclusion');return v;}
function groupById(id){return snap().groups.find(g=>g.id===+id);}
function saveGroup(g,patch,okText){return put('group',String(g.id),Object.assign({},g.doc,{v1:g.v1,v2:g.v2},patch),okText);}
function bindPractise(){
  $$('[data-practise-group]').forEach(b=>b.onclick=()=>{ui.practiseGroup=+b.dataset.practiseGroup;ui.practiseGroupTouched=true;renderRoute();});
  $$('[data-join]').forEach(b=>b.onclick=()=>put('member',String(ME.id),{groupId:+b.dataset.join},'Đã vào nhóm.'));
  $$('[data-change-group]').forEach(b=>b.onclick=()=>{if(confirm('Đổi nhóm? Bạn sẽ chọn lại nhóm của mình.'))del('member',String(ME.id));});
  $$('[data-assign]').forEach(sel=>sel.onchange=()=>sel.value?put('member',sel.dataset.assign,{groupId:+sel.value},'Đã xếp nhóm.'):del('member',sel.dataset.assign));
  $$('[data-save-setup]').forEach(b=>b.onclick=()=>{const s=snap(),count=+val('g_count')||s.count,groups={};s.groups.forEach(g=>{groups[g.id]={name:val(`g_name_${g.id}`)||g.name,leaderId:+val(`g_leader_${g.id}`)||null,pitcherId:+val(`g_pitcher_${g.id}`)||null};});put('setup','groups',{count,groups},'Đã lưu thiết lập nhóm.');});
  $$('[data-save-v1]').forEach(b=>b.onclick=()=>{const g=groupById(b.dataset.saveV1);readV1(g.v1);saveGroup(g,{},'Đã lưu V1.');});

function bindDirty(){qs('qbMain').oninput=e=>{if(e.target.closest('[data-assign],#g_count'))return;ui.dirty=true;};qs('qbMain').onfocusout=()=>{setTimeout(()=>{if(ui.pending&&!ui.dirty&&!(root.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)))renderRoute();},0);};$$('[data-reload]').forEach(b=>b.onclick=()=>{ui.dirty=false;renderRoute();});}
function pitchDeck(g){const v=g.v1;return `<div class="pitch-slide"><div class="kicker">${h(g.name)} • PHƯƠNG ÁN V1</div><h3>QUYẾT ĐỊNH CỦA NHÓM</h3><div class="big">${h(v.decision||'Chưa nhập quyết định')}</div><p><strong>Người pitching:</strong> ${h(g.pitcherId?personName(g.pitcherId):'—')}</p></div><div class="pitch-slide"><h3>BỐN MIỀN PHẨM CHẤT LÃNH ĐẠO</h3><div class="grid two">${['nhan','dao','chi','tam'].map(id=>`<div><span class="chip">${CONTENT.domains.find(d=>d.id===id).name}</span><strong>${h(v.traits[id]||'—')}</strong><p>${nl(v.behaviors[id]||'—')}</p></div>`).join('')}</div></div><div class="pitch-slide"><h3>NĂM GÓC NHÌN BUSINESS ACUMEN</h3><div class="grid two">${CONTENT.acumen.map(a=>`<div><span class="chip blue">${a.name}</span><p>${nl(v.acumen[a.id]||'—')}</p></div>`).join('')}</div></div><div class="pitch-slide"><h3>KẾ HOẠCH THỰC THI</h3><div class="grid two"><div><h4>Ba hành động then chốt</h4><p>${nl(v.actions||'—')}</p></div><div><h4>Rủi ro &amp; kiểm soát</h4><p>${nl(v.risks||'—')}</p></div></div></div><div class="pitch-slide"><h3>THÔNG ĐIỆP KẾT LUẬN</h3><div class="big">${nl(v.conclusion||'—')}</div></div>`;}
function exportPitch(g){const css=root.querySelector('style')?.textContent||'';const html=`<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${h(g.name)} - Pitching</title><style>${css}</style></head><body><div class="qlct-lesson"><div class="qb-app" style="padding:20px"><div style="max-width:1200px;margin:auto">${pitchDeck(g)}</div></div></div></body></html>`;downloadBlob(`${slug(g.name)}-pitching.html`,html,'text/html;charset=utf-8');}

/* ---------- LENS ---------- */
function lens(){
  const s=snap(), options=(sel)=>s.groups.map(g=>`<option value="${g.id}" ${+sel===g.id?'selected':''}>${h(g.name)}</option>`).join('');
  const others=s.groups.filter(g=>g.id!==s.myGroupId);
  const form=STAFF?`<div class="card"><h3>Ghi nhận góc nhìn trên màn hình lớp</h3><div class="form-grid"><div class="field"><label>Nhóm được góp ý</label><select id="lensTarget">${options(1)}</select></div><div class="field"><label>Nhóm đại diện</label><select id="lensFrom">${options(2)}</select></div><div class="field"><label>Loại góc nhìn</label><select id="lensType"><option>Phẩm chất lãnh đạo</option><option>Business Acumen</option><option>Tích hợp cả hai</option></select></div><div class="field full"><label>Nội dung</label><textarea id="lensText"></textarea></div></div><button class="btn" id="saveLens">Thêm</button></div>`
    : s.myGroupId?`<div class="card"><p class="muted">Bạn góp góc nhìn thay mặt <strong>${h(groupName(s,s.myGroupId))}</strong>.</p><div class="form-grid"><div class="field"><label>Nhóm đang được bổ sung góc nhìn</label><select id="lensTarget">${others.map(g=>`<option value="${g.id}">${h(g.name)}</option>`).join('')}</select></div><div class="field"><label>Góc nhìn thuộc</label><select id="lensType"><option>Phẩm chất lãnh đạo</option><option>Business Acumen</option><option>Tích hợp cả hai</option></select></div><div class="field full"><label>Góc nhìn bổ sung</label><textarea id="lensText"></textarea></div></div><button class="btn" id="saveLens">Gửi góc nhìn</button></div>`
    : `<div class="notice">Chọn nhóm của mình ở PRACTISE trước khi góp góc nhìn.</div>`;
  return shell('GÓC NHÌN BỔ SUNG','LENS',`<div class="quote">Từ mô thức vừa học và kinh nghiệm quản lý của mình, anh/chị nhìn thấy điều gì mà phương án của nhóm bạn chưa đề cập?</div><div class="spacer"></div>${form}<div class="spacer"></div><div class="card"><h3>Các góc nhìn đã ghi nhận (${s.lens.length})</h3><div id="lensList">${lensList(s)}</div></div>`,'LENS bổ sung góc nhìn; chưa sửa trực tiếp phương án của nhóm.');
}
function lensList(s){if(!s.lens.length)return '<div class="empty">Chưa có góc nhìn bổ sung.</div>';return s.lens.map(x=>`<div class="lens-card"><span class="badge">${h(x.type)}</span> <strong>${h(groupName(s,x.from))}</strong> → <strong>${h(groupName(s,x.target))}</strong>${teacherView()?` <span class="mini">· ${h(personName(x.userId))}</span>`:''}<p>${nl(x.text)}</p>${STAFF||x.userId===ME.id?`<button class="btn ghost small" data-del-lens="${h(x.id)}">Xóa</button>`:''}</div>`).join('');}
function bindLens(){
  qs('saveLens')&&(qs('saveLens').onclick=()=>{const s=snap(),text=val('lensText');if(!text)return alert('Vui lòng nhập góc nhìn.');const from=STAFF?+val('lensFrom'):s.myGroupId;const id=('l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toLowerCase();put('lens',id,{target:+val('lensTarget'),from,type:val('lensType'),text,at:new Date().toISOString()},'Đã gửi góc nhìn.');});
  $$('[data-del-lens]').forEach(b=>b.onclick=()=>{if(confirm('Xóa góc nhìn này?'))del('lens',b.dataset.delLens);});
  bindDirty();
}

/* ---------- IMPROVE ---------- */
function improve(){const s=snap();if(ui.improveGroup>=s.groups.length)ui.improveGroup=0;if(!STAFF&&s.myGroupId&&ui.improveGroupTouched!==true)ui.improveGroup=s.groups.findIndex(g=>g.id===s.myGroupId);return shell('CẢI TIẾN & CHỐT PHƯƠNG ÁN V2','IMPROVE',`<div class="quote">Mỗi nhóm đối chiếu phương án V1 với <strong>Paradigm 01 + Paradigm 02 + các góc nhìn LENS</strong>, lựa chọn điều có giá trị và chốt phương án V2.</div>${groupTabs(s,'data-improve-group',ui.improveGroup)}<div id="improveEditor">${improveGroup(s,s.groups[ui.improveGroup])}</div>`);}
function improveGroup(s,g){const v=g.v2,l=s.lens.filter(x=>+x.target===g.id),edit=canEditGroup(s,g)&&!v.locked,dis=edit?'':'disabled';return `<div class="compare"><div class="card v1"><div class="kicker">V1 • PRACTISE</div><h3>Phương án ban đầu</h3><div class="summary-box">${nl(g.v1.decision||'Chưa có V1')}</div><h4>Kết luận</h4><div class="summary-box">${nl(g.v1.conclusion||'—')}</div></div><div class="card v2"><div class="kicker">LENS</div><h3>Góc nhìn bổ sung</h3>${l.length?l.map(x=>`<div class="lens-card"><strong>${h(groupName(s,x.from))}</strong> • ${h(x.type)}<p>${nl(x.text)}</p></div>`).join(''):'<div class="empty">Chưa có góc nhìn dành cho nhóm này.</div>'}</div></div><div class="spacer"></div><div class="card"><div class="section-head"><div><div class="kicker">${h(g.name)}</div><h2 class="h-sm">CHỐT PHƯƠNG ÁN CẢI TIẾN</h2></div><div class="status ${v.locked?'locked':''}">${v.locked?'ĐÃ CHỐT V2':'ĐANG CẢI TIẾN'}</div></div>${pendingBar()}${v.locked?'<div class="locked-banner">V2 đã được chốt sau khi nhóm soi chiếu mô thức và LENS.</div>':''}${!canEditGroup(s,g)?`<div class="notice">Bạn đang xem phương án của nhóm khác (chỉ xem).</div>`:''}<div class="form-grid"><div class="field full"><label>1. Những góc nhìn nhóm quyết định tiếp thu</label><textarea id="i_accepted" ${dis}>${h(v.accepted)}</textarea></div><div class="field full"><label>2. Nội dung thay đổi so với V1</label><textarea id="i_changes" ${dis}>${h(v.changes)}</textarea></div><div class="field full"><label>3. Căn cứ cải tiến từ 02 Paradigm và LENS</label><textarea id="i_grounds" ${dis}>${h(v.grounds)}</textarea></div><div class="field full"><label>4. Phương án V2 cuối cùng</label><textarea id="i_final" ${dis}>${h(v.final)}</textarea></div></div><div class="actions">${edit?`<button class="btn" data-save-v2="${g.id}">Lưu V2</button><button class="btn gold" data-lock-v2="${g.id}">CHỐT V2</button>`:''}</div></div>`;}
function readV2(v){v.accepted=val('i_accepted');v.changes=val('i_changes');v.grounds=val('i_grounds');v.final=val('i_final');return v;}
function bindImprove(){
  $$('[data-improve-group]').forEach(b=>b.onclick=()=>{ui.improveGroup=+b.dataset.improveGroup;ui.improveGroupTouched=true;renderRoute();});
  $$('[data-save-v2]').forEach(b=>b.onclick=()=>{const g=groupById(b.dataset.saveV2);readV2(g.v2);saveGroup(g,{},'Đã lưu V2.');});
  $$('[data-lock-v2]').forEach(b=>b.onclick=()=>{const g=groupById(b.dataset.lockV2);readV2(g.v2);if(!confirm('Chốt V2? Sau khi chốt, nhóm không sửa V2 được nữa.'))return;g.v2.locked=true;saveGroup(g,{},'Đã chốt V2.');});
  bindDirty();
}

/* ---------- EXTRACT / RESOLVE (personal) ---------- */

function lensName(id){return (CONTENT.acumen.find(a=>a.id===id)||{}).name||''}
function traitOptions(domain,sel){const dm=CONTENT.domains.find(x=>x.id===domain);return dm?dm.traits.map(t=>`<option ${sel===t.name?'selected':''}>${t.name}</option>`).join(''):'<option value="">-- Chọn miền trước --</option>';}
function whoLabel(x,i){return ui.anon?`Học viên ${String(i+1).padStart(2,'0')}`:h(personName(x.userId));}
function extract(){const s=snap(),x=s.extracts.find(r=>r.userId===ME.id)||{};return shell('ĐÚC KẾT BÀI HỌC CÁ NHÂN','EXTRACT',`<div class="quote"><strong>TÔI HỌC ĐƯỢC GÌ?</strong> Hãy nhìn lại hai mô thức, trải nghiệm Practise – Lens – Improve và ghi lại điều có giá trị nhất với chính anh/chị.</div><div class="spacer"></div>${STAFF?'':`<div class="student-only card">${x.at?`<div class="notice">Đã lưu lúc ${h(new Date(x.at).toLocaleString('vi-VN'))}. Bạn có thể sửa và lưu lại.</div>`:''}<p class="mini">Bài đúc kết chỉ bạn và giảng viên xem được.</p><div class="form-grid"><div class="field"><label>Miền phẩm chất khiến tôi suy ngẫm nhiều nhất</label><select id="e_domain"><option value="">-- Chọn --</option>${CONTENT.domains.map(d=>`<option value="${d.id}" ${x.domain===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div><div class="field"><label>Phẩm chất cụ thể</label><select id="e_trait">${traitOptions(x.domain,x.trait)}</select></div><div class="field full"><label>Bài học tôi rút ra từ Paradigm 01</label><textarea id="e_p1">${h(x.p1)}</textarea></div><div class="field full"><label>Hành vi nào giúp nhận diện phẩm chất này?</label><textarea id="e_behavior">${h(x.behavior)}</textarea></div><div class="field"><label>Góc nhìn Business Acumen tôi dễ bỏ sót</label><select id="e_lens"><option value="">-- Chọn --</option>${CONTENT.acumen.map(a=>`<option value="${a.id}" ${x.lens===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="field full"><label>Bài học tôi rút ra từ Paradigm 02</label><textarea id="e_p2">${h(x.p2)}</textarea></div><div class="field full"><label>Bài học tích hợp: mối quan hệ giữa phẩm chất lãnh đạo và chất lượng quyết định kinh doanh</label><textarea id="e_integrated">${h(x.integrated)}</textarea></div><div class="field"><label>Trước đây, tôi thường nghĩ rằng…</label><textarea id="e_before">${h(x.before)}</textarea></div><div class="field"><label>Sau buổi học, tôi nhận ra rằng…</label><textarea id="e_after">${h(x.after)}</textarea></div><div class="field full"><label>Một câu tôi muốn mang theo sau buổi học</label><input id="e_sentence" maxlength="250" value="${h(x.sentence)}"></div></div><button class="btn gold" id="saveExtract">HOÀN THÀNH EXTRACT</button></div>`}<div class="teacher-only">${extractSummary(s)}</div>`,'EXTRACT là cá nhân; giảng viên tổng hợp để cả lớp cùng nhìn lại.');}
function extractSummary(s){return `<div class="card"><div class="section-head"><div><h3>BẢNG TỔNG HỢP EXTRACT CẢ LỚP</h3><p>${s.extracts.length} bài đúc kết đã lưu.</p></div></div><div class="actions"><button class="btn ghost" data-anon>${ui.anon?'Hiện tên':'Ẩn danh'}</button><button class="btn" data-csv-extract>Xuất Excel-compatible CSV</button><button class="btn secondary" data-print>In / Lưu PDF</button></div><div class="spacer"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Học viên</th><th>Paradigm 01</th><th>Paradigm 02</th><th>Bài học tích hợp</th><th>Câu ghi nhớ</th></tr></thead><tbody>${s.extracts.map((x,i)=>`<tr><td>${whoLabel(x,i)}</td><td><strong>${h(domainName(x.domain))} • ${h(x.trait)}</strong><br>${nl(x.p1)}</td><td><strong>${h(lensName(x.lens))}</strong><br>${nl(x.p2)}</td><td>${nl(x.integrated)}</td><td>${h(x.sentence)}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có dữ liệu.</td></tr>'}</tbody></table></div></div>`;}
function bindDomainTrait(domainId,traitId){const d=qs(domainId);if(d)d.onchange=()=>{qs(traitId).innerHTML=traitOptions(d.value,'');};}
function bindTeacherTables(){$$('[data-anon]').forEach(b=>b.onclick=()=>{ui.anon=!ui.anon;renderRoute();});$$('[data-csv-extract]').forEach(b=>b.onclick=exportExtractCSV);$$('[data-csv-resolve]').forEach(b=>b.onclick=exportResolveCSV);$$('[data-print]').forEach(b=>b.onclick=()=>window.print());}

function resolve(){const s=snap(),x=s.resolves.find(r=>r.userId===ME.id)||{};return shell('CAM KẾT HÀNH ĐỘNG 90 NGÀY','RESOLVE',`<div class="quote"><strong>TÔI SẼ THAY ĐỔI ĐIỀU GÌ?</strong> Chuyển bài học thành một cam kết hành động cụ thể, có mốc 30 – 60 – 90 ngày và bằng chứng hoàn thành.</div><div class="spacer"></div>${STAFF?'':`<div class="student-only card">${x.commitment?`<div class="notice"><strong>Cam kết đã chốt:</strong> ${h(x.commitment)}</div>`:''}<p class="mini">Cam kết chỉ bạn và giảng viên xem được.</p><div class="form-grid"><div class="field"><label>Miền phẩm chất ưu tiên</label><select id="r_domain"><option value="">-- Chọn --</option>${CONTENT.domains.map(d=>`<option value="${d.id}" ${x.domain===d.id?'selected':''}>${d.name}</option>`).join('')}</select></div><div class="field"><label>Phẩm chất cụ thể</label><select id="r_trait">${traitOptions(x.domain,x.trait)}</select></div><div class="field"><label>Góc nhìn Business Acumen ưu tiên</label><select id="r_lens"><option value="">-- Chọn --</option>${CONTENT.acumen.map(a=>`<option value="${a.id}" ${x.lens===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="field full"><label>Trong 90 ngày tới, tôi sẽ…</label><textarea id="r_action">${h(x.action)}</textarea></div><div class="field"><label>30 ngày – Tôi bắt đầu làm gì?</label><textarea id="r_30">${h(x.d30)}</textarea></div><div class="field"><label>60 ngày – Tôi cần tạo ra thay đổi nào?</label><textarea id="r_60">${h(x.d60)}</textarea></div><div class="field"><label>90 ngày – Tôi muốn chứng minh kết quả gì?</label><textarea id="r_90">${h(x.d90)}</textarea></div><div class="field"><label>Bằng chứng hoàn thành</label><textarea id="r_evidence">${h(x.evidence)}</textarea></div><div class="field"><label>Người/nguồn lực hỗ trợ</label><textarea id="r_support">${h(x.support)}</textarea></div><div class="field"><label>Rủi ro cản trở &amp; cách xử lý</label><textarea id="r_barrier">${h(x.barrier)}</textarea></div></div><button class="btn gold" id="saveResolve">CHỐT CAM KẾT 90 NGÀY</button></div>`}<div class="teacher-only">${resolveSummary(s)}</div>`,'RESOLVE là điểm kết thúc APPLIER của Buổi 01 và là đầu vào để theo dõi sau khóa học.');}
function resolveSummary(s){return `<div class="card"><div class="section-head"><div><h3>BẢNG CAM KẾT 90 NGÀY</h3><p>${s.resolves.length} cam kết đã chốt.</p></div></div><div class="actions"><button class="btn ghost" data-anon>${ui.anon?'Hiện tên':'Ẩn danh'}</button><button class="btn" data-csv-resolve>Xuất Excel-compatible CSV</button><button class="btn secondary" data-print>In / Lưu PDF</button></div><div class="spacer"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Học viên</th><th>Phẩm chất ưu tiên</th><th>Business Acumen</th><th>Hành động 90 ngày</th><th>30 ngày</th><th>60 ngày</th><th>90 ngày</th><th>Bằng chứng</th></tr></thead><tbody>${s.resolves.map((x,i)=>`<tr><td>${whoLabel(x,i)}</td><td>${h(domainName(x.domain))} • ${h(x.trait)}</td><td>${h(lensName(x.lens))}</td><td>${nl(x.action)}</td><td>${nl(x.d30)}</td><td>${nl(x.d60)}</td><td>${nl(x.d90)}</td><td>${nl(x.evidence)}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có dữ liệu.</td></tr>'}</tbody></table></div></div>`;}

}

/* ---------- DASHBOARD (instructor) ---------- */
function dashboard(){const s=snap(),n=board.roster.length,v1=s.groups.filter(g=>g.v1.locked).length,v2=s.groups.filter(g=>g.v2.locked).length,assigned=board.roster.filter(p=>s.memberOf.get(p.id)).length;return shell('DASHBOARD GIẢNG VIÊN','QUẢN TRỊ LỚP',`<div class="grid four"><div class="metric"><span>Học viên đã xếp nhóm</span><strong>${assigned}/${n}</strong></div><div class="metric"><span>Nhóm chốt V1</span><strong>${v1}/${s.count}</strong></div><div class="metric"><span>Nhóm chốt V2</span><strong>${v2}/${s.count}</strong></div><div class="metric"><span>Extract / Resolve</span><strong>${s.extracts.length} / ${s.resolves.length}</strong></div></div><div class="spacer"></div><div class="card"><h3>Tiến độ APPLIER</h3><p>V1 nhóm</p><div class="progress"><div style="width:${v1/s.count*100}%"></div></div><p>V2 nhóm</p><div class="progress"><div style="width:${v2/s.count*100}%"></div></div><p>Extract cá nhân</p><div class="progress"><div style="width:${n?Math.min(100,s.extracts.length/n*100):0}%"></div></div><p>Resolve cá nhân</p><div class="progress"><div style="width:${n?Math.min(100,s.resolves.length/n*100):0}%"></div></div></div><div class="spacer"></div><div class="card"><h3>Từng nhóm</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Nhóm</th><th>Thành viên</th><th>V1</th><th>V2</th><th>Lens nhận</th><th></th></tr></thead><tbody>${s.groups.map(g=>`<tr><td><strong>${h(g.name)}</strong></td><td>${g.memberIds.map(u=>h(personName(u))).join(', ')||'—'}</td><td>${g.v1.locked?'Đã chốt':g.v1.decision?'Đang soạn':'—'}</td><td>${g.v2.locked?'Đã chốt':g.v2.final?'Đang soạn':'—'}</td><td>${s.lens.filter(x=>+x.target===g.id).length}</td><td><button class="btn ghost small" data-unlock="v1:${g.id}" ${g.v1.locked?'':'disabled'}>Mở V1</button> <button class="btn ghost small" data-unlock="v2:${g.id}" ${g.v2.locked?'':'disabled'}>Mở V2</button></td></tr>`).join('')}</tbody></table></div></div><div class="spacer"></div><div class="card"><h3>Xuất dữ liệu lớp</h3><p class="muted">JSON là bản sao lưu toàn bộ bảng lớp; CSV mở được bằng Excel.</p><div class="actions"><button class="btn" data-export-all>Xuất toàn bộ JSON</button><button class="btn secondary" data-csv-extract>Xuất Extract CSV</button><button class="btn secondary" data-csv-resolve>Xuất Resolve CSV</button></div></div>`,'Chế độ giảng viên – không hiển thị cho học viên.');}
function bindDashboard(){
  $$('[data-unlock]').forEach(b=>b.onclick=()=>{const [part,id]=b.dataset.unlock.split(':'),g=groupById(id);if(!confirm(`Mở khóa ${part.toUpperCase()} của ${g.name}?`))return;g[part].locked=false;saveGroup(g,{},`Đã mở khóa ${part.toUpperCase()}.`);});
  $$('[data-export-all]').forEach(b=>b.onclick=()=>{const s=snap();downloadBlob('buoi01-class-data.json',JSON.stringify({exportedAt:new Date().toISOString(),roster:board.roster,groups:s.groups.map(g=>({id:g.id,name:g.name,members:g.memberIds.map(personName),leader:g.leaderId?personName(g.leaderId):'',pitcher:g.pitcherId?personName(g.pitcherId):'',v1:g.v1,v2:g.v2})),lens:s.lens.map(x=>Object.assign({},x,{author:personName(x.userId)})),extracts:s.extracts.map(x=>Object.assign({student:personName(x.userId)},x)),resolves:s.resolves.map(x=>Object.assign({student:personName(x.userId)},x))},null,2),'application/json');});
  bindTeacherTables();
}

function csvCell(v){return `"${String(v??'').replace(/"/g,'""')}"`;}
function exportExtractCSV(){const s=snap(),rows=[['Học viên','Miền phẩm chất','Phẩm chất','Bài học Paradigm 01','Hành vi nhận diện','Business Acumen','Bài học Paradigm 02','Bài học tích hợp','Trước đây','Sau buổi học','Câu ghi nhớ']];s.extracts.forEach((x,i)=>rows.push([ui.anon?`Học viên ${String(i+1).padStart(2,'0')}`:personName(x.userId),domainName(x.domain),x.trait,x.p1,x.behavior,lensName(x.lens),x.p2,x.integrated,x.before,x.after,x.sentence]));downloadBlob('extract-buoi01.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');}
function exportResolveCSV(){const s=snap(),rows=[['Học viên','Miền phẩm chất','Phẩm chất','Business Acumen','Hành động 90 ngày','30 ngày','60 ngày','90 ngày','Bằng chứng','Hỗ trợ','Rủi ro & xử lý','Câu cam kết']];s.resolves.forEach((x,i)=>rows.push([ui.anon?`Học viên ${String(i+1).padStart(2,'0')}`:personName(x.userId),domainName(x.domain),x.trait,lensName(x.lens),x.action,x.d30,x.d60,x.d90,x.evidence,x.support,x.barrier,x.commitment]));downloadBlob('resolve-90-ngay-buoi01.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');}
function downloadBlob(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;root.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

/* ---------- global wiring ---------- */
root.addEventListener('click',e=>{
  const r=e.target.closest('[data-route]');if(r){navTo(r.dataset.route);return;}
  const m=e.target.closest('[data-mode]');if(m){setMode(m.dataset.mode);return;}
  if(e.target.closest('[data-present]')){root.querySelector('.qb-app').classList.toggle('present-mode');if(document.fullscreenElement)document.exitFullscreen?.();else root.querySelector('.qb-app').requestFullscreen?.();}
});
board.onChange(onRemote);
render();

</script>
